    desc: 'возможность перенаправлять материю определенным образом.' },
  { name: 'CUBE', imgs: ['cube.png'], needAct: 4,
    desc: 'кубы способны перемещать/перемещаться по измерениям, находясь в слоях, обволакивающих самих себя. Как правило, каждый слой является измерением.' },
  { name: 'ORSAL', imgs: ['highouterversal.webp'], needAct: 4,
    desc: 'высвобождение определения, которое не имеет так таковой масштабности, из-за того, что ни одно множество, даже неисчисляемое, не может превзойти или сравнится с этим определением.' },
  { name: 'S/CUBE', imgs: ['smokecube.webp'], needAct: 4,
    desc: 'возможность куба воспроизводить величину, связанную с кардинальным исчислением.' },
  { name: 'VOROT', imgs: ['vodovorot.webp', 'badvodovorot.webp'], needAct: 5,
    desc: 'относительность отношения. В этом понимании число может равняться элементу, как и элемент исчисляться равенством. В таком понимании остаток числа является равным главному числу.' },
  { name: 'GORTAL', imgs: ['portal.webp'], needAct: 6,
    desc: 'открытие иного метода определения для сохранения статичности соотношения, из-за преодоления каких-либо зависимостей и концепций.' },
  { name: 'Hologram', imgs: ['clonegarvi.webp'], needAct: 6,
    desc: 'возможность создания голограмного остатка себя — как следствие статической динамичности из-за соотношения реальности, которая ничего не значит.' },
  { name: 'LIGHTFUL', imgs: ['lightik.webp'], needAct: 6,
    desc: 'явление' },
  { name: 'FLOW/IMPRESSION', imgs: [], needAct: 2,
    desc: 'в эпоху забытых колец, души открыли в себе явления, которые в скоре начали называть печатями. С помощью печати душа являлась целью, которую она себе поставила. Не многим удавалось раскрыть в себе эту печать, но тем, кто достиг ее частицу - обретал право знать координаты колец.' },
  { name: 'WAEV', imgs: [], needAct: 7,
    desc: 'лучи, способные предопределять намерения души. предопределение делит намерение на большую составляющую, обволакивая достаточность.' },
  { name: 'dissol', imgs: ['psykosone.webp'], needAct: 8,
    desc: 'отрицание нахождения из-за положения разности.' },
  { name: 'Psyk', imgs: ['black.png'], needAct: 8,
    desc: 'отрицание масштабирования.' },
  { name: 'Reveling', imgs: [], needAct: 8,
    desc: 'реверсирование явления.' },
  { name: 'Ention', imgs: ['arbienergy.png'], needAct: 9,
    desc: 'воспроизведение движения как статичности самой по себе. преобразование этого свойства в игнорирование свойств тех или иных принципов.' },
  { name: 'X', imgs: ['highik.webp'], needAct: 9,
    desc: 'пространство, которое содержит в себе все измерения.' }
];
function termIsActUnlocked(n) {
  try { return localStorage.getItem('act' + n + 'running') === '1'; } catch(e) { return false; }
}
function termMarkActStarted(n) {
  try { localStorage.setItem('act' + n + 'running', '1'); } catch(e) {}
}

function renderObjImages(images) {
  objImageWrap.innerHTML = '';
  for (const src of images) {
    const box = document.createElement('div');
    box.className = 'objImgBox';
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.onerror = () => { img.style.display = 'none'; };
    box.appendChild(img);
    objImageWrap.appendChild(box);
  }
}

function termOpenObj(o) {
  objTitle.textContent = o.name;
  let imgs = o.imgs || [];
  if (o.imgs2 && o.needFor2 && termIsActUnlocked(o.needFor2)) imgs = o.imgs2;
  renderObjImages(imgs);
  objInfo.textContent = o.desc || '';
  objPanel.classList.add('on');
}
function termCloseObj() {
  objPanel.classList.remove('on');
  objImageWrap.innerHTML = '';
}

function termOpenPage(title, text) {
  pageTitle.textContent = title;
  pageBody.textContent = text;
  pagePanel.classList.add('on');
}
function termClosePage() {
  pagePanel.classList.remove('on');
  pageBody.textContent = '';
}

function termOpenSkill(s) {
  pageTitle.textContent = s.name;
  pageBody.innerHTML = '';
  if (s.imgs && s.imgs.length) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;gap:12px;justify-content:center;align-items:center;margin-bottom:20px;flex-wrap:wrap;';
    for (const src of s.imgs) {
      const img = document.createElement('img');
      img.src = src;
      img.style.cssText = 'max-height:140px;max-width:40%;object-fit:contain;image-rendering:pixelated;';
      img.onerror = () => { img.style.display = 'none'; };
      wrap.appendChild(img);
    }
    pageBody.appendChild(wrap);
  }
  const p = document.createElement('div');
  p.textContent = s.desc;
  pageBody.appendChild(p);
  pagePanel.classList.add('on');
}
function termIsMaxActDone() {
  for (let n = 2; n <= 9; n++) {
    try { if (localStorage.getItem('act' + n + 'done') === '1') return n; } catch(e){}
  }
  return 1;
}
function termIsVisible(item) {
  const need = item.needAct || 2;
  const maxDone = termIsMaxActDone();
  return maxDone >= need - 1 || termIsActUnlocked(need);
}
function termRenderColumn(col) {
  colTabs.forEach(el => el.classList.toggle('active', el.dataset.col === col));

  if (col === 'objects') {
  termContent.innerHTML = '';
  for (const o of TERM_OBJECTS) {
    if (!termIsVisible(o)) continue;
    const div = document.createElement('div');
    div.className = 'termItem';
    div.textContent = o.name;
    div.onclick = () => termOpenObj(o);
    termContent.appendChild(div);
  }
  return;
}

  if (col === 'archive') {
  termContent.innerHTML = '';
  for (const a of TERM_ARCHIVE) {
    if (!termIsVisible(a)) continue;
    const div = document.createElement('div');
    div.className = 'termItem';
    div.textContent = a.title;
    div.onclick = () => termOpenPage(a.title, a.text);
    termContent.appendChild(div);
  }
  return;
}
  if (col === 'skills') {
  termContent.innerHTML = '';
  for (const s of TERM_SKILLS) {
    if (!termIsVisible(s)) continue;
    const div = document.createElement('div');
    div.className = 'termItem';
    div.textContent = s.name;
    div.onclick = () => termOpenSkill(s);
    termContent.appendChild(div);
  }
  return;
}
  if (col === 'state') {
  termContent.innerHTML = '';
  for (let a = 2; a <= 9; a++) {
    const unlocked = termIsActUnlocked(a);
    const div = document.createElement('div');
    div.className = 'termItem';
    div.textContent = `Act${a}`;
    div.onclick = () => {
      if (!unlocked) return;
      termMarkActStarted(a);
      termCloseAll();
      switchToAct(a);
    };
    termContent.appendChild(div);
  }
  const fm = document.createElement('div');
  fm.className = 'termItem';
  fm.style.marginTop = '10px';
  fm.textContent = 'FORGIVE ME';
  fm.onclick = () => {
    // Ищем акт, который ещё не пройден (нет actNdone), и переходим туда
    let next = 2;
    while (next <= 9) {
      const started = termIsActUnlocked(next);
      const done = (() => { try { return localStorage.getItem('act' + next + 'done') === '1'; } catch(e) { return false; } })();
      if (!started) break;   // ещё не начинали — стоп
      if (!done) break;      // начали, но не прошли — стоп
      next++;
    }
    if (next > 9) return;
    termMarkActStarted(next);
    termCloseAll();
    switchToAct(next);
  };
  termContent.appendChild(fm);
  return;
}
}

colTabs.forEach(el => {
  el.onclick = () => termRenderColumn(el.dataset.col);
});

document.getElementById('termClose').onclick = () => termCloseAll();
document.getElementById('objClose').onclick = termCloseObj;
document.getElementById('pageClose').onclick = termClosePage;

function termOpen() {
  if (termState.open) return;
  termState.open = true;
  terminalEl.classList.add('on');
  termRenderColumn('objects');
}
function termCloseAll() {
  termState.open = false;
  terminalEl.classList.remove('on');
  if (objPanel.classList.contains('on')) termCloseObj();
  if (pagePanel.classList.contains('on')) termClosePage();
}

// Кнопка ТЕРМ + клавиша T
termBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); termOpen(); }, {passive:false});
termBtn.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); termOpen(); });
window.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 't' && !termState.open) termOpen();
  if (e.key === 'Escape') {
    if (objPanel.classList.contains('on')) termCloseObj();
    else if (pagePanel.classList.contains('on')) termClosePage();
    else if (termState.open) termCloseAll();
  }
});

// Переключение акта
function switchToAct(n) {
  pendingAct = n;
  transitionActive = true;
  transitionTimer = 0.01;
}
window.addEventListener('keydown', e => {
  if (termState.open) return;
  if (transitionActive) return;

  const k = e.key.toLowerCase();

  // 1 — КРЮК
  if (k === '1' || k === 'ц' || k === '!') {
    if (victoryPhase !== 'none') return;
    if (act8 && (act8Phase === 'statueIdle' || act8Phase === 'dialogs' || act8Phase === 'arbiDialogs' || act8Phase === 'arbiTalks')) return;
    if (act2 || act3 || act4 || act5 || act6 || act7 || act8) {
      if (!ant.active && ant.cooldown <= 0) {
        ant.active = true; ant.timer = ANT_DURATION;
        ant.x = player.x + Math.cos(player.dir) * 1.5;
        ant.y = player.y + Math.sin(player.dir) * 1.5;
        ant.attackCd = 2.0; ant.attackAnim = 0;
        if (isWall(ant.x, ant.y)) { ant.x = player.x; ant.y = player.y; }
      }
    } else if (player.hookAnim <= 0) {
      player.hookAnim = HAND_ACTION_DURATION; player.hookTarget = getHookTarget();
    }
  }

  // 2 — РЫВОК
  if (k === '2' || k === 'у' || k === '@') {
    if (player.frozenTimer > 0) return;
    if (player.dashTimer > 0) {
      player.dashSpeed = 24.0; player.dashTimer = Math.max(player.dashTimer, 0.25); player.dashAnim = 0.35;
    } else {
      player.dashSpeed = 12.0; player.dashTimer = 0.25; player.dashAnim = 0.35;
    }
    player.handKick = -joy.vx * HAND_KICK_MAX;
    player.shake = Math.max(player.shake, 0.3);
  }

  // 3 — РУКА
  if (k === '3' || k === 'к' || k === '#') {
    if (victoryPhase !== 'none') return;
    if (act3 && bossPhase === 'hurt') return;
    if (act3 && bossPhase === 'f1' && molten.alive && molten.mode === 'talk') return;
    if (act4 && (act4Phase === 'talk' || act4Phase === 'hurt_talk' || act4Phase === 'f2_transition')) return;
    if (act5 && (act5Phase === 'talk1' || act5Phase === 'talk2' || act5Phase === 'death_talk')) return;
    if (act6 && act6Phase === 'talk') return;
    if (act7 && (act7Phase === 'bossLine' || act7Phase === 'dialog')) return;
    if (act8 && (act8Phase === 'statueIdle' || act8Phase === 'dialogs' || act8Phase === 'arbiDialogs' || act8Phase === 'arbiTalks')) return;
    if (act2 || act3 || act4 || act5 || act6 || act7 || act8) {
      player.fistAnim = 0.25;
      lineCounter = (lineCounter % 4) + 1;
      spawnLine(lineCounter);
      if (act4 && act4Phase === 'f1' && saimon.alive && saimon.state !== 'retreat') startSaimonRetreat();
      if (act5 && (act5Phase === 'phase1' || act5Phase === 'phase2') && garvi.alive && garvi.mode === 'active') garviTryDodge();
    } else if (player.fistAnim <= 0) {
      player.fistAnim = HAND_ACTION_DURATION; punch();
    }
  }

  // 4 — СВЕТ
  if (k === '4' || k === 'ф' || k === '$') {
    handRingTimer = 0.7;
    handRingEl.style.display = 'block';
    if (!lightUnlocked) return;
    if (victoryPhase !== 'none') return;
    const aimTarget = getLightTarget();
    if (aimTarget) {
      player.x = aimTarget.x;
      player.y = aimTarget.y;
      const idx = lightItems.indexOf(aimTarget);
      if (idx >= 0) lightItems.splice(idx, 1);
      player.hp = Math.min(player.maxHp, player.hp + 5);
      player.gainText = '+5';
      player.gainTextTimer = 1.0;
      player.shake = Math.max(player.shake, 0.3);
      return;
    }
    const hit = castRay(player.x, player.y, player.dir);
    let dist = hit.dist;
    if (dist > 15) dist = 15;
    if (dist < 0.5) return;
    let lx = player.x + Math.cos(player.dir) * (dist - 0.3);
    let ly = player.y + Math.sin(player.dir) * (dist - 0.3);
    let lz = EYE_H * 0.8;
    if (pitchPixels < -H*0.1) lz = 0.15;
    lightItems.push({ x: lx, y: ly, z: lz });
  }

  // Z — терминал
  if (k === 'z' || k === 'я') {
    if (!termState.open) termOpen();
  }
});

// ============ START ============
startAct2();
function updateAct9(dt) {
  if (!act9Object.alive) return;

  // Проверка: игрок вошёл в комнату с объектом
  // Комната — выше стеклянной стены (y < 5)
  if (player.y < 5) {
    act9EndingPhase = 'fadeOut';
    act9EndingTimer = 0;
    return;
  }

  if (act9EndingPhase === 'fadeOut') {
    act9EndingTimer += dt;
    const a = Math.min(1, act9EndingTimer / 1.0);
    act9BlackEl.style.display = 'flex';
    act9BlackEl.style.opacity = a;
    if (act9EndingTimer >= 1.0) {
      act9EndingPhase = 'showText';
      act9EndingTimer = 0;
      act9BlackEl.style.opacity = '1';
      act9Object.alive = false;
      act9ObjEl.style.display = 'none';
    }
    return;
  }

  if (act9EndingPhase === 'showText') {
    act9EndingTimer += dt;
    if (act9EndingTimer >= 3.0) {
      act9EndingPhase = 'fadeIn';
      act9EndingTimer = 0;
    }
    return;
  }

  if (act9EndingPhase === 'fadeIn') {
    act9EndingTimer += dt;
    const a = 1 - Math.min(1, act9EndingTimer / 1.0);
    act9BlackEl.style.opacity = a;
    if (act9EndingTimer >= 1.0) {
      act9BlackEl.style.display = 'none';
      act9BlackEl.style.opacity = '1';
      act9EndingPhase = 'none';
      // Переход в Act 1
      transitionActive = true;
      transitionTimer = 0.01;
      pendingAct = 1;
    }
    return;
  }
}
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
