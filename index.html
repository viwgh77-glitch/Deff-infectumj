function buildCloudLayers(theme, skyH){
  const isRed = theme.clouds === 'red';
  const layers = [];
  const cloudCount = 14;
  for (let i = 0; i < cloudCount; i++) {
    const seed = i * 137.5;
    const baseX = (Math.sin(seed) * 0.5 + 0.5);
    const baseY = (Math.cos(seed * 1.3) * 0.5 + 0.5);
    const cw = W * (0.25 + (Math.sin(seed * 2.1) * 0.5 + 0.5) * 0.35);
    const ch = skyH * (0.06 + (Math.cos(seed * 1.7) * 0.5 + 0.5) * 0.08);
    layers.push({ x: baseX, y: baseY, w: cw, h: ch, phase: i, alpha: isRed ? 0.55 : 0.6 });
  }
  return layers;
}

function drawProceduralClouds(horizon, shakeX, shakeY, theme){
  if (!theme.clouds) return;
  const skyH = horizon;
  if (skyH <= 0) return;
  ctx.save();
  ctx.translate(shakeX, shakeY);
  const isRed = theme.clouds === 'red';

  const isRedGrad = ctx.createRadialGradient(W*0.5, skyH*0.5, 0, W*0.5, skyH*0.5, W*0.5);
  if (isRed) {
    isRedGrad.addColorStop(0, 'rgba(200,20,20,0.55)');
    isRedGrad.addColorStop(0.15, 'rgba(120,0,0,0.4)');
    isRedGrad.addColorStop(0.5, 'rgba(40,0,0,0.2)');
    isRedGrad.addColorStop(1, 'rgba(0,0,0,0)');
  } else {
    isRedGrad.addColorStop(0, 'rgba(30,100,180,0.5)');
    isRedGrad.addColorStop(0.2, 'rgba(10,50,100,0.35)');
    isRedGrad.addColorStop(0.6, 'rgba(0,10,30,0.15)');
    isRedGrad.addColorStop(1, 'rgba(0,0,0,0)');
  }
  ctx.fillStyle = isRedGrad;
  ctx.fillRect(0, 0, W, skyH);
  const key = isRed ? 'red' : 'blue';
  if (cloudCache[key] === null || cloudCache.w !== W || cloudCache.h !== skyH) {
    cloudCache[key] = buildCloudLayers(theme, skyH);
    cloudCache.w = W; cloudCache.h = skyH;
  }
  const layers = cloudCache[key];
  for (let s = 0; s < 3; s++) {
    const expand = 1 + s * 0.18;
    const alpha = layers[0].alpha * (0.55 - s * 0.15);
    ctx.fillStyle = `rgba(0,0,0,${alpha.toFixed(3)})`;
    ctx.beginPath();
    for (let i = 0; i < layers.length; i++) {
      const L = layers[i];
      const drift = Math.sin(t * 10 + L.phase) * 0.03;
      const cx = ((L.x + drift + 1) % 1) * W;
      const cy = L.y * skyH;
      ctx.moveTo(cx + L.w*expand, cy);
      ctx.ellipse(cx, cy, L.w*expand, L.h*expand, 0, 0, Math.PI * 2);
    }
    ctx.fill();
  }
  ctx.restore();
}

const ASPECT_CACHE = {};
const DEFAULT_ASPECT = 0.45;
function getAspect(src){
  if (ASPECT_CACHE[src] !== undefined) return ASPECT_CACHE[src];
  const img = preloads[src];
  if (img && img.naturalHeight > 0) {
    ASPECT_CACHE[src] = img.naturalWidth / img.naturalHeight;
    return ASPECT_CACHE[src];
  }
  return DEFAULT_ASPECT;
}
function isLoaded(src){
  const img = preloads[src];
  return img && img.complete && img.naturalWidth > 0;
}
Object.values(preloads).forEach(img => {
  if (img.complete) {
    if (img.naturalHeight > 0) ASPECT_CACHE[img.src] = img.naturalWidth / img.naturalHeight;

      if (img.naturalHeight > 0) ASPECT_CACHE[img.src] = img.naturalWidth / img.naturalHeight;
    });
  }
});

function getLightTarget() {
  let best = null;
  let bestAngle = 0.035;
  const fx = Math.cos(player.dir), fy = Math.sin(player.dir);
  for (const li of lightItems) {
    const dx = li.x - player.x, dy = li.y - player.y;
    const d = Math.hypot(dx, dy);
    if (d < 0.4) continue;
    if (!hasLineOfSight(player.x, player.y, li.x, li.y)) continue;
    const dot = (dx * fx + dy * fy) / d;
    const ang = Math.acos(Math.max(-1, Math.min(1, dot)));
    if (ang < bestAngle) {
      bestAngle = ang;
      best = li;
    }
  }
  return best;
}

function hasLineOfSight(x1, y1, x2, y2){
  const dx=x2-x1, dy=y2-y1;
  const dist=Math.hypot(dx,dy);
  if (dist<0.01) return true;
  const steps=Math.ceil(dist/0.1);
  for (let i=1;i<steps;i++){
    const t=i/steps;
    if (isWall(x1+dx*t, y1+dy*t)) return false;
  }
  return true;
}

function isAimingAt(e){
  const dx=e.x-player.x, dy=e.y-player.y;
  const dist=Math.hypot(dx,dy);
  if (!act2 && !act3 && !act4 && !act5 && !act6 && !act7 && !act8 && dist>PLAYER_MELEE_RANGE) return false;
  if (!hasLineOfSight(player.x, player.y, e.x, e.y)) return false;
  if (dist<0.6) return true;
  let a=Math.atan2(dy,dx)-player.dir;
  while(a>Math.PI) a-=2*Math.PI;
  while(a<-Math.PI) a+=2*Math.PI;
  const screenX=W/2+Math.tan(a)*(W/2)/Math.tan(FOV/2);
  const projScale=H*0.9;
  const eh=(act2||act3||act4||act5||act6||act7||act8)?ENEMY_HEIGHT_2:ENEMY_HEIGHT;
  const hpx=(eh/Math.max(0.4,dist))*projScale;
  const wpx=hpx*0.45;
  return Math.abs(W/2-screenX)<wpx*0.55;
}

function punch(){
  for (const e of enemies){
    if (!e.alive) continue;
    if (!isAimingAt(e)) continue;
    e.hp--; e.hitFlash=0.35;
    if (e.hp<=0){
      e.alive=false;
      const gain=1+Math.floor(Math.random()*200);
      player.hp=Math.min(player.maxHp, player.hp+gain);
      player.gainText='+'+gain; player.gainTextTimer=1.5;
    }
  }
}

function getHookTarget(){
  let best=null, bestDot=HOOK_AIM_DOT;
  const fx=Math.cos(player.dir), fy=Math.sin(player.dir);
  for (const e of enemies){
    if (!e.alive) continue;
    const dx=e.x-player.x, dy=e.y-player.y;
    const d=Math.hypot(dx,dy);
    if (d>HOOK_RANGE||d<0.1) continue;
    const dot=(dx*fx+dy*fy)/d;
    if (dot>bestDot){ bestDot=dot; best=e; }
  }
  return best;
}

let actx=null;

function isWall(x, y){
  const cx=Math.floor(x), cy=Math.floor(y);
  if (cx<0||cy<0||cx>=MAP_W||cy>=MAP_H) return true;
  const c=map[cy][cx];
  return c===1||c===3;
}

function isWallForEnemy(x, y) {
  const r=0.3;
  if (isWall(x-r, y-r)) return true;
  if (isWall(x+r, y-r)) return true;
  if (isWall(x-r, y+r)) return true;
  if (isWall(x+r, y+r)) return true;
  return false;
}

function distToSegment(px, py, x1, y1, x2, y2) {
  const l2=(x2-x1)**2+(y2-y1)**2;
  if (l2===0) return Math.hypot(px-x1, py-y1);
  let t=((px-x1)*(x2-x1)+(py-y1)*(y2-y1))/l2;
  t=Math.max(0, Math.min(1, t));
  return Math.hypot(px-(x1+t*(x2-x1)), py-(y1+t*(y2-y1)));
}

function project(wx, wy, wz) {
  const dx=wx-player.x, dy=wy-player.y;
  let angle=Math.atan2(dy,dx)-player.dir;
  while(angle>Math.PI) angle-=Math.PI*2;
  while(angle<-Math.PI) angle+=Math.PI*2;
  const dist=Math.hypot(dx,dy);
  const depth=dist*Math.cos(angle);
  if (depth<=0.1) return null;
  const projScale=H*0.9;
  const horizon=H/2+pitchPixels+Math.sin(player.bob)*3;
  const screenX=W/2+Math.tan(angle)*(W/2)/Math.tan(FOV/2);
  const screenY=horizon+(EYE_H-wz)/depth*projScale;
  return {x:screenX, y:screenY};
}

function isInView(x, y, margin) {
  let a=Math.atan2(y-player.y, x-player.x)-player.dir;
  while(a>Math.PI) a-=2*Math.PI;
  while(a<-Math.PI) a+=2*Math.PI;
  return Math.abs(a)<FOV/2-(margin||0);
}

function spawnLine(type) {
  const frontHit=castRay(player.x, player.y, player.dir);
  const forwardDist=Math.min(3.0, frontHit.dist-0.3);
  const cx=player.x+Math.cos(player.dir)*forwardDist;
  const cy=player.y+Math.sin(player.dir)*forwardDist;
  const rightHit=castRay(cx, cy, player.dir+Math.PI/2);
  const leftHit=castRay(cx, cy, player.dir-Math.PI/2);
  const rx=cx+Math.cos(player.dir+Math.PI/2)*rightHit.dist;
  const ry=cy+Math.sin(player.dir+Math.PI/2)*rightHit.dist;
  const lx=cx+Math.cos(player.dir-Math.PI/2)*leftHit.dist;
  const ly=cy+Math.sin(player.dir-Math.PI/2)*leftHit.dist;
  const Lx=cx+(lx-cx)*0.35;
  const Ly=cy+(ly-cy)*0.35;
  const Rx=cx+(rx-cx)*0.35;
  const Ry=cy+(ry-cy)*0.35;
  activeLines.push({
    type:type,
    L:{x:Lx,y:Ly}, R:{x:Rx,y:Ry}, C:{x:cx,y:cy},
    z1:type===1?0.5:(type===2?2.0:0.0),
    z2:type===1?0.5:(type===2?2.0:2.4),
    zCenter:type===1?0.5:(type===2?2.0:1.2),
    timer:0, hitEnemies:new Set()
  });
}

  bossPhase='hurt'; molten.alive=false; molten.mode='dead';
  hurtTimer=2.0; hurtTalkIdx=0; hurtTalkTimer=0;
  moltenEl.style.display='none';
  player.shake=Math.max(player.shake,1.0);
}
function startOuterPhase() {
    
  bossPhase='outer'; outerTimer=5.0;
  moltenEl.style.display='none'; smokeEl.style.display='none';
  player.shake=1.8;
  outerWorldX=player.x+Math.cos(player.dir)*4.0;
  outerWorldY=player.y+Math.sin(player.dir)*4.0;
  playMusic('act3outer');
}
function startPhase2() {
  bossPhase='f2'; moltenEl.style.display='none';
  smoke.alive=true; smoke.hp=SMOKE_MAX_HP; smoke.maxHp=SMOKE_MAX_HP;
  smoke.x=player.x+Math.cos(player.dir+Math.PI)*4.0;
  smoke.y=player.y+Math.sin(player.dir+Math.PI)*4.0;
  if (isWallForEnemy(smoke.x, smoke.y)) { smoke.x=player.x; smoke.y=player.y+1; }
  smoke.mode='idle'; smoke.teleportTimer=1.5; smoke.farCubeTimer=2.0; smoke.atakTimer=0; smoke.fade=0.7;
  smokeEl.src='smokemolten.webp'; smokeEl.dataset.src='smokemolten.webp'; smokeEl.style.display='block';
  smokeNearPortal.active=false; smokeFarPortals.length=0; smokeCubes.length=0;
}
function smokeDie() {
  bossPhase='dead'; smoke.alive=false;
  smokeEl.style.display='none'; smokeNearPortal.active=false; smokeFarPortals.length=0; smokeCubes.length=0;
  player.shake=Math.max(player.shake,1.0);
  try { localStorage.setItem('act3done','1'); } catch(e){}
}
function moltenPickTeleportSpot() {
  let best=null, bestScore=-999;
  for (let tries=0;tries<40;tries++){
    const rx=3+Math.random()*25, ry=11+Math.random()*8;
    if (isWallForEnemy(rx,ry)) continue;
    const dToPlayer=Math.hypot(rx-player.x, ry-player.y);
    if (dToPlayer<3.5) continue;
    let a=Math.atan2(ry-player.y, rx-player.x)-player.dir;
    while(a>Math.PI) a-=2*Math.PI;
    while(a<-Math.PI) a+=2*Math.PI;
    const inView=Math.abs(a)<FOV/2;
    const score=(inView?15:0)+dToPlayer;
    if (score>bestScore){ bestScore=score; best={x:rx,y:ry}; }
  }
  if (!best) best={x:16.0,y:15.0};
  return best;
}

function updateMolten(dt) {
  if (bossPhase!=='f1'||!molten.alive) return;
  if (molten.mode==='talk') {
    molten.talkTimer+=dt;
    const totalDur=10.0;
    const perLine=totalDur/MOLTEN_LINES.length;
    const idx=Math.min(MOLTEN_LINES.length-1, Math.floor(molten.talkTimer/perLine));
    molten.talkIdx=idx;
    if (molten.talkTimer>=totalDur) {
      molten.mode='idle'; molten.attackTimer=1.0+Math.random()*2.0;
      molten.teleportTimer=4.0+Math.random()*1.0;
      molten.moveTimer=0.4+Math.random()*0.6; molten.moveDir=0;
    }
    return;
  }
  if (molten.mode==='dead') return;
  if (molten.mode==='teleportOut') {
    molten.fade-=dt*1.0; molten.portal=Math.min(1, molten.portal+dt*3);
    if (molten.fade<=0) {
      molten.fade=0; molten.mode='teleportIn'; molten.portalStage=1; molten.portal=0;
      const spot=moltenPickTeleportSpot(); molten.x=spot.x; molten.y=spot.y;
      molten.teleportTimer=1.0;
    }
    return;
  }
  if (molten.mode==='teleportIn') {
    molten.teleportTimer-=dt;
    if (molten.portalStage===1) molten.portal=Math.min(1, molten.portal+dt*4);
    if (molten.teleportTimer<=0) {
      molten.fade=1; molten.mode='idle'; molten.portal=0; molten.portalStage=2;
      molten.teleportTimer=4.0+Math.random()*1.0; molten.attackTimer=1.0+Math.random()*2.0;
    }
    return;
  }
  if (molten.portal>0&&molten.portalStage===2){ molten.portal-=dt*1.2; if (molten.portal<0) molten.portal=0; }
  molten.teleportTimer-=dt;
  const dToPlayer=Math.hypot(player.x-molten.x, player.y-molten.y);
  if (dToPlayer<4.5&&molten.mode!=='teleportOut'&&molten.mode!=='teleportIn'){ if (molten.teleportTimer>2.0) molten.teleportTimer=1.0+Math.random()*1.0; }
  if (molten.teleportTimer<=0&&molten.mode==='idle'){ molten.mode='teleportOut'; molten.showBigCube=0.3; return; }
  if (molten.showBigCube>0) molten.showBigCube-=dt;
  if (molten.mode==='attack') {
    molten.attackAnim-=dt;
    if (molten.attackAnim<=0) {
      const dx=player.x-molten.x, dy=player.y-molten.y;
      const d=Math.hypot(dx,dy)||1;
      moltenCubes.push({x:molten.x,y:molten.y,vx:dx/d*CUBE_SPEED,vy:dy/d*CUBE_SPEED,life:4.0});
      molten.mode='idle'; molten.attackTimer=1.0+Math.random()*2.0;
      molten.teleportTimer=Math.max(molten.teleportTimer,4.0);
    }
    return;
  }
  molten.attackTimer-=dt;
  if (molten.attackTimer<=0){ molten.mode='attack'; molten.attackAnim=0.4; return; }
  molten.moveTimer-=dt;
  if (molten.moveTimer<=0){
    const r=Math.random();
    if (r<0.30) molten.moveDir=-1;
    else if (r<0.60) molten.moveDir=1;
    else if (r<0.90) molten.moveDir=2;
    else molten.moveDir=0;
    molten.moveTimer=0.4+Math.random()*0.9;
  }
  const mspeed=1.8;
  if (molten.moveDir===-1){ const nx=molten.x-mspeed*dt; if (!isWallForEnemy(nx,molten.y)) molten.x=nx; }
  else if (molten.moveDir===1){ const nx=molten.x+mspeed*dt; if (!isWallForEnemy(nx,molten.y)) molten.x=nx; }
  else if (molten.moveDir===2){
    const dx=player.x-molten.x, dy=player.y-molten.y;
    const d=Math.hypot(dx,dy)||1;
    const nx=molten.x-(dx/d)*mspeed*dt;
    const ny=molten.y-(dy/d)*mspeed*dt;
    if (!isWallForEnemy(nx,molten.y)) molten.x=nx;
    if (!isWallForEnemy(molten.x,ny)) molten.y=ny;
  }
  for (let i=moltenCubes.length-1;i>=0;i--){
    const c=moltenCubes[i];
    c.x+=c.vx*dt; c.y+=c.vy*dt; c.life-=dt;
    if (isWallForEnemy(c.x,c.y)||c.life<=0){ moltenCubes.splice(i,1); continue; }
    if (Math.hypot(c.x-player.x, c.y-player.y)<0.6){
      player.hp=Math.max(0,player.hp-CUBE_DAMAGE);
      player.shake=Math.max(player.shake,0.5);
      moltenCubes.splice(i,1);
    }
  }
}

function smokePickNearPlayerSpot() {
  for (let tries=0;tries<30;tries++){
    const ang=player.dir+(Math.random()-0.5)*(FOV*0.7);
    const rad=2.2+Math.random()*2.5;
    const rx=player.x+Math.cos(ang)*rad;
    const ry=player.y+Math.sin(ang)*rad;
    if (isWallForEnemy(rx,ry)) continue;
    if (!isInView(rx,ry,0.1)) continue;
    return {x:rx,y:ry};
  }
  const fx=player.x+Math.cos(player.dir)*3.0;
  const fy=player.y+Math.sin(player.dir)*3.0;
  if (!isWallForEnemy(fx,fy)) return {x:fx,y:fy};
  return {x:player.x+2,y:player.y};
}
function smokePickFarCubeSpot() {
  for (let tries=0;tries<40;tries++){
    const rx=3+Math.random()*25, ry=11+Math.random()*8;
    if (isWallForEnemy(rx,ry)) continue;
    const d=Math.hypot(rx-player.x, ry-player.y);
    if (d<3.0) continue;
    if (!isInView(rx,ry,0.05)) continue;
    return {x:rx,y:ry};
  }
  const ang=player.dir;
  const rx=player.x+Math.cos(ang)*5;
  const ry=player.y+Math.sin(ang)*5;
  if (!isWallForEnemy(rx,ry)) return {x:rx,y:ry};
  return {x:player.x+4,y:player.y};
}

function updateSmoke(dt) {
  if (bossPhase!=='f2'||!smoke.alive) return;
  smoke.fade=0.7;
  const dNow=Math.hypot(player.x-smoke.x, player.y-smoke.y);
  if (dNow<SMOKE_TOUCH_RANGE){ player.hp=Math.max(0,player.hp-SMOKE_TOUCH_DPS*dt); player.shake=Math.max(player.shake,0.15); }
  if (smokeNearPortal.active){ smokeNearPortal.life-=dt; if (smokeNearPortal.life<=0) smokeNearPortal.active=false; }
  for (let i=smokeFarPortals.length-1;i>=0;i--){ smokeFarPortals[i].life-=dt; if (smokeFarPortals[i].life<=0) smokeFarPortals.splice(i,1); }
  if (smoke.mode==='atak') {
    smoke.atakTimer-=dt;
    const dx=player.x-smoke.x, dy=player.y-smoke.y;
    const dd=Math.hypot(dx,dy)||1;
    const step=4.0*dt;
    const nx=smoke.x+(dx/dd)*step;
    const ny=smoke.y+(dy/dd)*step;
    if (!isWallForEnemy(nx,smoke.y)) smoke.x=nx;
    if (!isWallForEnemy(smoke.x,ny)) smoke.y=ny;
    if (Math.hypot(player.x-smoke.x, player.y-smoke.y)<SMOKE_TOUCH_RANGE){ player.hp=Math.max(0,player.hp-SMOKE_TOUCH_DPS*dt); player.shake=Math.max(player.shake,0.15); }
    if (smoke.atakTimer<=0){
      smoke.mode='idle';
      smokeEl.src='smokemolten.webp'; smokeEl.dataset.src='smokemolten.webp';
      smoke.teleportTimer=SMOKE_TELEPORT_INTERVAL_MIN+Math.random()*(SMOKE_TELEPORT_INTERVAL_MAX-SMOKE_TELEPORT_INTERVAL_MIN);
    }
    return;
  }
  smoke.teleportTimer-=dt;
  if (smoke.teleportTimer<=0&&smoke.mode==='idle'){
    const spot=smokePickNearPlayerSpot();
    smokeNearPortal.active=true; smokeNearPortal.x=spot.x; smokeNearPortal.y=spot.y;
    smokeNearPortal.life=SMOKE_NEAR_PORTAL_LIFE; smokeNearPortal.maxLife=SMOKE_NEAR_PORTAL_LIFE;
    smoke.x=spot.x; smoke.y=spot.y;
    smokeEl.style.display='none';
    smoke.mode='atak'; smoke.atakTimer=SMOKE_ATAKING_DURATION;
    smokeEl.src='smokemoltenataking.webp'; smokeEl.dataset.src='smokemoltenataking.webp';
    smokeEl.style.display='block';
    return;
  }
  smoke.farCubeTimer-=dt;
  if (smoke.farCubeTimer<=0){
    const spot=smokePickFarCubeSpot();
    smokeFarPortals.push({x:spot.x,y:spot.y,life:SMOKE_FAR_PORTAL_LIFE,maxLife:SMOKE_FAR_PORTAL_LIFE,hasCube:true});
    const dx=player.x-spot.x, dy=player.y-spot.y;
    const d=Math.hypot(dx,dy)||1;
    const cubSpeed=3.5;
    smokeCubes.push({x:spot.x,y:spot.y,vx:dx/d*cubSpeed,vy:dy/d*cubSpeed,life:6.0,size:SMOKE_CUBE_SIZE_FAR});
    smoke.farCubeTimer=SMOKE_FAR_CUBE_MIN+Math.random()*(SMOKE_FAR_CUBE_MAX-SMOKE_FAR_CUBE_MIN);
  }
  if (smoke.mode==='idle'){
    const dx=player.x-smoke.x, dy=player.y-smoke.y;
    const d=Math.hypot(dx,dy)||1;
    if (d>1.2){
      const nx=smoke.x+(dx/d)*SMOKE_CHASE_SPEED*dt;
      const ny=smoke.y+(dy/d)*SMOKE_CHASE_SPEED*dt;
      if (!isWallForEnemy(nx,smoke.y)) smoke.x=nx;
      if (!isWallForEnemy(smoke.x,ny)) smoke.y=ny;
    }
  }
  for (let i=smokeCubes.length-1;i>=0;i--){
    const c=smokeCubes[i];
    c.x+=c.vx*dt; c.y+=c.vy*dt; c.life-=dt;
    if (c.life<=0||isWallForEnemy(c.x,c.y)){ smokeCubes.splice(i,1); continue; }
    if (Math.hypot(c.x-player.x, c.y-player.y)<0.8){
      player.hp=Math.max(0,player.hp-SMOKE_CUBE_DAMAGE);
      player.shake=Math.max(player.shake,0.4);
      smokeCubes.splice(i,1);
    }
  }
}

// ============ ACT 4 ============
function startSaimonRetreat() { saimon.state='retreat'; saimon.retreatTimer=0.5; saimon.retreatDir=Math.random()<0.5?-1:1; }
function saimonStartVoda() { voda.active=true; voda.x=8.0; voda.y=6.5; voda.mode='idle'; }
function saimonTransitionToF2() { act4Phase='f2_transition'; voda.active=true; voda.mode='moveToBoss'; }
function startVorotPhase() {
  act4Phase='f2'; saimon.alive=false;
  saimonEl.style.display='none'; saimonHandEl.style.display='none';
  vorot.alive=true; vorot.hp=VOROT_MAX_HP; vorot.maxHp=VOROT_MAX_HP;
  vorot.x=saimon.x; vorot.y=saimon.y;
  vorot.vodovorotTimer=1.0; vorot.badvodovorotTimer=1.5;
  vorot._wanderAngle=Math.random()*Math.PI*2; vorot._wanderTimer=0.5+Math.random()*0.8;
  vorotEl.src='vorotsaimon.webp'; vorotEl.dataset.src='vorotsaimon.webp'; vorotEl.style.display='block';
  vodovorots.length=0; badvodovorots.length=0; waterOverlay=1.0;
}
function vorotDie() {
  act4Phase='dead'; vorot.alive=false;
  vorotEl.style.display='none'; vodovorots.length=0; badvodovorots.length=0;
  player.shake=Math.max(player.shake,1.0);
  try { localStorage.setItem('act4done','1'); } catch(e){}
}
function vorotFleeStep(dt) {
  if (vorot._wanderTimer===undefined){ vorot._wanderTimer=0; vorot._wanderAngle=Math.random()*Math.PI*2; }
  vorot._wanderTimer-=dt;
  if (vorot._wanderTimer<=0){ vorot._wanderAngle=Math.random()*Math.PI*2; vorot._wanderTimer=0.6+Math.random()*0.8; }
  let mx=Math.cos(vorot._wanderAngle), my=Math.sin(vorot._wanderAngle);
  const cx=8.0, cy=7.5;
  const toCenterX=cx-vorot.x, toCenterY=cy-vorot.y;
  const centerDist=Math.hypot(toCenterX,toCenterY);
  if (centerDist>0.1){
    const centerWeight=Math.min(1.0, centerDist/5.0);
    mx+=(toCenterX/centerDist)*centerWeight*1.2;
    my+=(toCenterY/centerDist)*centerWeight*1.2;
  }
  const step=VOROT_FLEE_SPEED*dt;
  let nx=vorot.x+mx*step, ny=vorot.y+my*step;
  if (isWallForEnemy(nx,ny)){
    const px=-my, py=mx;
    const side=Math.random()<0.5?1:-1;
    nx=vorot.x+px*side*step; ny=vorot.y+py*side*step;
    if (isWallForEnemy(nx,ny)){ vorot._wanderAngle=Math.random()*Math.PI*2; vorot._wanderTimer=0.4; nx=vorot.x; ny=vorot.y; }
  }
  vorot.x=nx; vorot.y=ny;
  vorot.facing=Math.atan2(player.y-vorot.y, player.x-vorot.x);
}
function spawnVodovorot() { vodovorots.push({x:vorot.x, y:vorot.y, life:VODOVOROT_LIFE}); }
function spawnBadvodovorot() {
  const ang=Math.random()*Math.PI*2;
  const rad=1.5+Math.random()*1.0;
  let bx=vorot.x+Math.cos(ang)*rad;
  let by=vorot.y+Math.sin(ang)*rad;
  if (isWallForEnemy(bx,by)){ bx=vorot.x; by=vorot.y; }
  badvodovorots.push({x:bx, y:by, life:BADVODOROT_LIFE});
}

function updateSaimon(dt) {
  if (act4Phase==='talk') {
    saimonTalkTimer+=dt;
    const totalDur=10.0;
    const perLine=totalDur/SAIMON_LINES.length;
    const idx=Math.min(SAIMON_LINES.length-1, Math.floor(saimonTalkTimer/perLine));
    saimonTalkIdx=idx;
    if (saimonTalkTimer>=totalDur){ act4Phase='f1'; saimonTalkTimer=0; playMusic('saimon'); }
    return;
  }
  if (act4Phase==='f1'&&saimon.alive) {
    const dxP=player.x-saimon.x, dyP=player.y-saimon.y;
    const distP=Math.hypot(dxP,dyP)||1;
    saimon.handCooldown-=dt;
    if (saimon.handAttackAnim>0) saimon.handAttackAnim-=dt;
    if (saimon.handCooldown<=0&&distP<SAIMON_HAND_REACH&&saimon.state!=='retreat'){
      saimon.handCooldown=SAIMON_HAND_COOLDOWN; saimon.handAttackAnim=0.6;
      if (distP<SAIMON_HAND_ATTACK_RANGE+0.6){ player.hp=Math.max(0,player.hp-SAIMON_HAND_DAMAGE); player.shake=Math.max(player.shake,0.5); }
    }
    if (saimon.state==='retreat') {
      saimon.retreatTimer-=dt;
      const bx=-dxP/distP, by=-dyP/distP;
      const px=-by, py=bx;
      const mvx=bx+px*saimon.retreatDir*0.7;
      const mvy=by+py*saimon.retreatDir*0.7;
      const mlen=Math.hypot(mvx,mvy)||1;
      const nx=saimon.x+(mvx/mlen)*SAIMON_RETREAT_SPEED*dt;
      const ny=saimon.y+(mvy/mlen)*SAIMON_RETREAT_SPEED*dt;
      if (!isWallForEnemy(nx,saimon.y)) saimon.x=nx;
      if (!isWallForEnemy(saimon.x,ny)) saimon.y=ny;
      if (saimon.retreatTimer<=0) saimon.state='chase';
    } else {
      if (distP>1.2) {
        const nx=saimon.x+(dxP/distP)*SAIMON_CHASE_SPEED*dt;
        const ny=saimon.y+(dyP/distP)*SAIMON_CHASE_SPEED*dt;
        let moved=false;
        if (!isWallForEnemy(nx,saimon.y)){ saimon.x=nx; moved=true; }
        if (!isWallForEnemy(saimon.x,ny)){ saimon.y=ny; moved=true; }
        if (!moved) {
          const px=-dyP/distP, py=dxP/distP;
          if (!saimon._sideSign||Math.random()<0.02) saimon._sideSign=Math.random()<0.5?-1:1;
          const sx=saimon.x+px*saimon._sideSign*SAIMON_SIDE_SPEED*dt;
          const sy=saimon.y+py*saimon._sideSign*SAIMON_SIDE_SPEED*dt;
          if (!isWallForEnemy(sx,saimon.y)) saimon.x=sx;
          if (!isWallForEnemy(saimon.x,sy)) saimon.y=sy;
        }
      }
    }
    saimon.facing=Math.atan2(dyP,dxP);
    if (saimon.hp<=150&&!voda.active) saimonStartVoda();
    if (saimon.hp<=0){
      act4Phase='hurt_talk'; saimonTalkTimer=0;
      if (!voda.active){ voda.active=true; voda.x=8.0; voda.y=6.5; }
      voda.mode='moveToBoss';
      saimonHandEl.style.display='none';
    }
    return;
  }
  if (act4Phase==='hurt_talk') {
    saimonTalkTimer+=dt;
    if (voda.active&&voda.mode==='moveToBoss'){
      const dx=saimon.x-voda.x, dy=saimon.y-voda.y;
      const d=Math.hypot(dx,dy);
      if (d>0.4){ const vspd=2.0; voda.x+=(dx/d)*vspd*dt; voda.y+=(dy/d)*vspd*dt; }
      else {
        voda.active=false; vodaEl.style.display='none';
        saimonEl.src='saimonhurt.webp'; saimonEl.dataset.src='saimonhurt.webp';
        saimonTransitionToF2();
      }
    }
    return;
  }
  if (act4Phase==='f2_transition') {
    waterOverlay=Math.min(1.0, waterOverlay+dt*0.5);
    if (waterOverlay>=1.0){ saimonEl.style.display='none'; startVorotPhase(); }
    return;
  }
  if (act4Phase==='f2'&&vorot.alive) {
    vorotFleeStep(dt);
    vorot.vodovorotTimer-=dt;
    if (vorot.vodovorotTimer<=0){ spawnVodovorot(); vorot.vodovorotTimer=VOROT_SPAWN_MIN+Math.random()*(VOROT_SPAWN_MAX-VOROT_SPAWN_MIN); }
    vorot.badvodovorotTimer-=dt;
    if (vorot.badvodovorotTimer<=0){ spawnBadvodovorot(); vorot.badvodovorotTimer=2.0+Math.random()*1.0; }
    for (let i=vodovorots.length-1;i>=0;i--){
      const v=vodovorots[i];
      v.life-=dt;
      if (v.life<=0){ vodovorots.splice(i,1); continue; }
      if (Math.hypot(v.x-player.x, v.y-player.y)<VODOVOROT_TOUCH_RANGE){
        player.hp=Math.max(0,player.hp-VODOVOROT_DAMAGE);
        player.frozenTimer=Math.max(player.frozenTimer,VODOVOROT_FREEZE);
        player.shake=Math.max(player.shake,0.5);
        vodovorots.splice(i,1);
      }
    }
    for (let i=badvodovorots.length-1;i>=0;i--){
      const b=badvodovorots[i];
      b.life-=dt;
      if (b.life<=0){ badvodovorots.splice(i,1); continue; }
      const dx=b.x-player.x, dy=b.y-player.y;
      const d=Math.hypot(dx,dy);
      if (d<BADVODOROT_PULL_RANGE&&d>0.01){
        const pull=BADVODOROT_PULL_FORCE*dt;
        const nx=player.x+(dx/d)*pull;
        const ny=player.y+(dy/d)*pull;
        if (!isWall(nx,player.y)) player.x=nx;
        if (!isWall(player.x,ny)) player.y=ny;
      }
      if (d<VODOVOROT_TOUCH_RANGE){
        player.hp=Math.max(0,player.hp-BADVODOROT_DAMAGE);
        player.shake=Math.max(player.shake,0.8);
        badvodovorots.splice(i,1);
      }
    }
    return;
  }
}

let last=performance.now();
function update(dt){
  if (transitionActive) {
    transitionTimer-=dt;
    if (transitionTimer<=0) {
      transitionActive=false;
      if (pendingAct===2) startAct2();
      else if (pendingAct===3) startAct3();
      else if (pendingAct===4) startAct4();
      else if (pendingAct===5) startAct5();

if (player.frozenTimer>0) player.frozenTimer-=dt;

if (mag>1){ fwd/=mag; str/=mag; }
  let speed=3.2;

    speed=player.dashSpeed; player.dashTimer-=dt;

  }
  if (player.frozenTimer>0){ fwd=0; str=0; }
  const fx=Math.cos(player.dir), fy=Math.sin(player.dir);
  const sx=-fy, sy=fx;
  const nx=player.x+(fx*fwd+sx*str)*speed*dt;
  const ny=player.y+(fy*fwd+sy*str)*speed*dt;
  if (!isWall(nx,player.y)) player.x=nx;
  if (!isWall(player.x,ny)) player.y=ny;
  player.moving=Math.hypot(fwd,str);
  player.bob+=dt*player.moving*12;
  if (player.dashTimer<=0&&player.dashSpeed>0){ player.handKick*=Math.exp(-12*dt); if (Math.abs(player.handKick)<0.4) player.handKick=0; }

    const dy = targetY - player.y;

    if (dist > 0.2) {

      player.y += (dy / dist) * act8WalkBackSpeed * dt;

    } else {
      player.x = targetX;
      player.y = targetY;
      act8Phase = 'arbiDialogs';

  }

  if (act8Phase === 'arbiDialogs') {

    act8ArbiDialogIdx = idx;

    if (act8Timer >= perLine * ACT8_ARBI_DIALOGS.length) {
      act8Phase = 'shake';
      act8Timer = 0;
      act8ShakeTimer = 2.0;
      act8BossEl.src = 'arbi.png';
      act8BossEl.dataset.src = 'arbi.png';
      player.shake = 1.0;

  if (act8Phase === 'shake') {

    // Медленно подходит к игроку

    const dy = player.y - act8Boss.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 2.0) {
      const spd = 1.2;
      const nx = act8Boss.x + (dx / dist) * spd * dt;
      const ny = act8Boss.y + (dy / dist) * spd * dt;
      if (!isWallForEnemy(nx, act8Boss.y)) act8Boss.x = nx;
      if (!isWallForEnemy(act8Boss.x, ny)) act8Boss.y = ny;
    }

    if (act8Timer >= perLine * ACT8_BOSS_TALKS.length + 1.0) {
      act8BossEl.src = 'arbi.png';
      act8BossEl.dataset.src = 'arbi.png';
      act8Phase = 'preBoss';
      act8Timer = 0;
    }
    return;
  }

  if (act8Phase === 'preBoss') {
    act8Timer += dt;
    if (act8Timer > 2.0) {
      act8Phase = 'bossFight';
      act8Boss.mode = 'boss';
      act8BossEl.src = 'arbi.webp';
      act8BossEl.dataset.src = 'arbi.webp';
      restoreButtons();
      act8Ability1Timer = ACT8_ABILITY1_MIN + Math.random() * (ACT8_ABILITY1_MAX - ACT8_ABILITY1_MIN);
      act8Ability2Timer = ACT8_ABILITY2_MIN + Math.random() * (ACT8_ABILITY2_MAX - ACT8_ABILITY2_MIN);
    }
    return;
  }

  if (act8Phase === 'bossFight') {
  if (!act8Boss.alive) {
    act8Phase = 'bossDead';
    act8Timer = 0;
    player.shake = Math.max(player.shake, 1.0);
    try { localStorage.setItem('act8done', '1'); } catch(e){}
    return;
  }

    // Проверка фазы 2
    if (act8BossPhase === 1 && act8Boss.hp <= act8Boss.maxHp / 2) {
      act8BossPhase = 2;
      act8BossSpeed = ACT8_BOSS_CHASE_SPEED_FAST;
      act8BossEl.src = 'arbienergy.webp';
      act8BossEl.dataset.src = 'arbienergy.webp';
      act8BossTalked = false;
      act8BossDialogIdx = 0;
      act8BossDialogTimer = 2.0;
    }

    // Диалог "наконец-то."
    if (act8BossPhase === 2 && !act8BossTalked) {
      act8BossDialogTimer -= dt;
      if (act8BossDialogTimer <= 0) {
        act8BossTalked = true;
      }
    }

    // Движение к игроку
    // Рывок босса (вторая способность)
if (act8DashTimer > 0) {
  act8DashTimer -= dt;
  const nx = act8Boss.x + act8DashVX * dt;
  const ny = act8Boss.y + act8DashVY * dt;
  if (!isWallForEnemy(nx, act8Boss.y)) act8Boss.x = nx;
  if (!isWallForEnemy(act8Boss.x, ny)) act8Boss.y = ny;
} else {
  // Обычное движение к игроку
  const dx = player.x - act8Boss.x;
  const dy = player.y - act8Boss.y;
  const dist = Math.hypot(dx, dy) || 1;
  const nx = act8Boss.x + (dx / dist) * act8BossSpeed * dt;
  const ny = act8Boss.y + (dy / dist) * act8BossSpeed * dt;
  if (!isWallForEnemy(nx, act8Boss.y)) act8Boss.x = nx;
  if (!isWallForEnemy(act8Boss.x, ny)) act8Boss.y = ny;
}

// Контактный урон
const dist = Math.hypot(player.x - act8Boss.x, player.y - act8Boss.y) || 1;
if (dist < ACT8_BOSS_TOUCH_RANGE) {
  player.hp = Math.max(0, player.hp - ACT8_BOSS_TOUCH_DAMAGE * dt);
  player.shake = Math.max(player.shake, 0.15);
}

    // Способность 1 (всегда доступна)
    act8Ability1Timer -= dt;
    if (act8Ability1Timer <= 0) {
      act8Ability1Timer = ACT8_ABILITY1_MIN + Math.random() * (ACT8_ABILITY1_MAX - ACT8_ABILITY1_MIN);
      spawnAct8Ability1();
    }

    // Способность 2 (только фаза 2)
    if (act8BossPhase === 2) {
      act8Ability2Timer -= dt;
      if (act8Ability2Timer <= 0) {
        act8Ability2Timer = ACT8_ABILITY2_MIN + Math.random() * (ACT8_ABILITY2_MAX - ACT8_ABILITY2_MIN);
        spawnAct8Ability2();
      }
    }

    // Обновление снарядов
    for (let i = act8EnergyProjectiles.length - 1; i >= 0; i--) {
      const p = act8EnergyProjectiles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;

      if (p.life <= 0 || isWallForEnemy(p.x, p.y)) {
        act8EnergyProjectiles.splice(i, 1);
        continue;
      }

      if (Math.hypot(p.x - player.x, p.y - player.y) < ACT8_ENERGY_HIT_RANGE) {
        player.hp = Math.max(0, player.hp - ACT8_ENERGY_DAMAGE);
        player.shake = Math.max(player.shake, 0.4);
        act8EnergyProjectiles.splice(i, 1);
      }
    }
    return;
  }
}

function spawnAct8Ability1() {
  // Три energy появляются у босса, выстраиваются в линию к игроку
  // и летят с одинаковой скоростью, но КАЖДЫЙ останавливается там,
  // где игрок был в момент спавна (не гарантирует попадание).
  const baseX = act8Boss.x;
  const baseY = act8Boss.y;

  const dx = player.x - baseX;
  const dy = player.y - baseY;
  const dist = Math.hypot(dx, dy) || 1;
  const dirX = dx / dist;
  const dirY = dy / dist;

  // Целевая точка — там, где игрок был при спавне
  const targetX = player.x;
  const targetY = player.y;

  const spd = ACT8_ENERGY_SPEED;

  // Три снаряда стартуют из одной точки у босса,
  // но с разной задержкой по расстоянию — выстраиваются в линию по пути.
  // Используем "дугу" через уже пройденные смещения:
  const positions = [0.0, 0.35, 0.7]; // 0 = у босса, дальше = смещён вперёд
  for (const t of positions) {
    const sx = baseX + dirX * dist * t * 0.5;
    const sy = baseY + dirY * dist * t * 0.5;
    // Скорость — фиксированная, направление — точно на targetX/targetY
    const tdx = targetX - sx;
    const tdy = targetY - sy;
    const tlen = Math.hypot(tdx, tdy) || 1;
    const life = tlen / spd + 0.2;
    act8EnergyProjectiles.push({
      x: sx, y: sy,
      vx: (tdx / tlen) * spd,
      vy: (tdy / tlen) * spd,
      life: life,
      size: ACT8_ENERGY_SIZE
    });
  }
  
}

function spawnAct8Ability2() {
  // Босс делает резкий рывок ВБОК-ВПЕРЁД к игроку.
  // Три arbienergy.png стоят ПОЗАДИ босса и летят ДАЛЬШЕ от игрока
  // (в противоположную от игрока сторону), каждая отдаляется по-своему.
  const baseX = act8Boss.x;
  const baseY = act8Boss.y;

  const dx = player.x - baseX;
  const dy = player.y - baseY;
  const dist = Math.hypot(dx, dy) || 1;
  const dirX = dx / dist;
  const dirY = dy / dist;

  const perpX = -dirY;
  const perpY = dirX;
  const sideOffset = (Math.random() < 0.5 ? -1 : 1) * 0.8;

  // Три объекта ПОЗАДИ босса (дальше от игрока), на разной дистанции
  // и летят ещё дальше от игрока (то есть в -dirX/-dirY)
  const behindDist = [1.0, 2.2, 3.4];
  const spd = ACT8_ENERGY_SPEED;

  for (const bd of behindDist) {
    const sx = baseX - dirX * bd + perpX * sideOffset;
    const sy = baseY - dirY * bd + perpY * sideOffset;
    // Летят в сторону ОТ игрока (обратное направление)
    const awayVX = -dirX * spd + perpX * sideOffset * 1.5;
    const awayVY = -dirY * spd + perpY * sideOffset * 1.5;
    const vlen = Math.hypot(awayVX, awayVY) || 1;
    act8EnergyProjectiles.push({
      x: sx, y: sy,
      vx: (awayVX / vlen) * spd,
      vy: (awayVY / vlen) * spd,
      life: 2.0,
      size: ACT8_ENERGY_SIZE
    });
  }

  // РЫВОК БОССА — направление вбок-вперёд к игроку, скорость высокая
  const dashDirX = dirX + perpX * sideOffset * 0.5;
  const dashDirY = dirY + perpY * sideOffset * 0.5;
  const dashLen = Math.hypot(dashDirX, dashDirY) || 1;
  const dashSpeed = 22.0;
  act8DashVX = (dashDirX / dashLen) * dashSpeed;
  act8DashVY = (dashDirY / dashLen) * dashSpeed;
  act8DashTimer = 0.35;
}

  if (portalEl.parentNode) portalEl.style.display='none';

}

function updateAct6(dt) {
  if (act6Phase === 'idle') {
    const dist = Math.hypot(player.x - wake.x, player.y - wake.y);
    if (dist < 4.0) {
      act6Phase = 'talk';
      act6TalkTimer = 0;
      act6TalkIdx = 0;
    }
    portalVisible = true;
    return;
  }

  if (act6Phase === 'talk') {
    act6TalkTimer += dt;
    const totalDur = 10.0;
    const perLine = totalDur / ACT6_DIALOGS.length;
    const idx = Math.min(ACT6_DIALOGS.length - 1, Math.floor(act6TalkTimer / perLine));
    act6TalkIdx = idx;
    if (act6TalkTimer >= totalDur) {
      act6Phase = 'waiting';
    }
    return;
  }

 if (act6Phase === 'waiting') {
  const distToPortal = Math.hypot(player.x - portal.x, player.y - portal.y);
  if (distToPortal < 1.5 && portalVisible) {
    try { localStorage.setItem('act6done','1'); } catch(e){}
    transitionActive = true;
    transitionTimer = 1.5;
    pendingAct = 7;
    return;
  }
  return;
}
  if (act6Phase === 'fight') {
    if (!wake.alive) return;

    const dist = Math.hypot(player.x - wake.x, player.y - wake.y);
    if (dist < WAKE_TOUCH_RANGE) {
      player.hp = Math.max(0, player.hp - WAKE_TOUCH_DPS * dt);
      player.shake = Math.max(player.shake, 0.15);
    }

    wakeLineCooldown -= dt;
    if (wakeLineCooldown <= 0) {
      wakeLineCooldown = WAKE_LINE_COOLDOWN_MIN + Math.random() * (WAKE_LINE_COOLDOWN_MAX - WAKE_LINE_COOLDOWN_MIN);
      wakeLines.push({
        type: 'horizontal',
        y: player.y,
        timer: 0,
        life: WAKE_LINE_LIFE,
        hit: false
      });
    }
    wakeSideLineCooldown -= dt;
    if (wakeSideLineCooldown <= 0) {
      wakeSideLineCooldown = WAKE_SIDE_LINE_COOLDOWN_MIN + Math.random() * (WAKE_SIDE_LINE_COOLDOWN_MAX - WAKE_SIDE_LINE_COOLDOWN_MIN);
      const fromLeft = Math.random() < 0.5;
      const lineSpeed = (MAP_W - 1) / WAKE_LINE_LIFE;
      wakeLines.push({
        type: 'moving',
        y: player.y,
        dirX: fromLeft ? 1 : -1,
        speed: lineSpeed,
        x: fromLeft ? 0.5 : MAP_W - 0.5,
        timer: 0,
        life: WAKE_LINE_LIFE,
        hit: false
      });
    }

    for (let i = wakeLines.length - 1; i >= 0; i--) {
      const wl = wakeLines[i];
      if(!wl) continue;
      wl.timer += dt;
      if (wl.type === 'moving') {
        wl.x += wl.dirX * wl.speed * dt;
        if (wl.dirX > 0 && wl.x > MAP_W - 0.5) {
          wakeLines.splice(i, 1);
          continue;
        }
        if (wl.dirX < 0 && wl.x < 0.5) {
          wakeLines.splice(i, 1);
          continue;
        }
      }
      if (wl.timer >= wl.life) {
        wakeLines.splice(i, 1);
        continue;
      }
      if (!wl.hit && wl.timer > 0.1) {
        const hitPlayer = (wl.type === 'horizontal')
          ? Math.abs(player.y - wl.y) < 0.5
          : Math.abs(player.y - wl.y) < 0.5 && Math.abs(player.x - wl.x) < 0.7;
        if (hitPlayer) {
          player.hp = Math.max(0, player.hp - WAKE_LINE_DAMAGE);
          player.shake = Math.max(player.shake, 0.4);
          wl.hit = true;
        }
      }
    }
    return;
  }

  if (act6Phase === 'victory') {
    victoryTimer += dt;

    if (victoryPhase === 'none') {
      victoryPhase = 'approach';
      victoryTimer = 0;
      hideAllButtons();
      handEl.style.display = 'none';
      wakeEl.style.display = 'block';
      wakeEl.src = 'wake.webp';
      wakeEl.dataset.src = 'wake.webp';
      return;
    }

    if (victoryPhase === 'approach') {
      const dx = wake.x - player.x, dy = wake.y - player.y;
      const dist = Math.hypot(dx, dy);
      const APPROACH_SPEED = 0.8;
      if (dist > 0.2) {
        player.x += (dx / dist) * APPROACH_SPEED * dt;
        player.y += (dy / dist) * APPROACH_SPEED * dt;
      }
      player.dir = Math.atan2(dy, dx);
      if (dist <= 0.5) {
        wakeEl.style.display = 'none';
        victoryHandEl.src = 'bartlightik.png';
        victoryHandEl.dataset.src = 'bartlightik.png';
        victoryHandEl.style.display = 'block';
        victoryHandEl.style.zIndex = '1500';
        victoryHandEl.style.opacity = '1';
        victoryPhase = 'hand1';
        victoryTimer = 0;
      }
      return;
    }

    if (victoryPhase === 'hand1') {
      if (victoryTimer > 5.0) {
        victoryHandEl.src = 'nobody.webp';
        victoryHandEl.dataset.src = 'nobody.webp';
        victoryHandEl.style.display = 'block';
        victoryHandEl.style.zIndex = '1500';
        victoryHandEl.style.opacity = '1';
        victoryPhase = 'fantom';
        victoryTimer = 0;
      }
      return;
    }

    if (victoryPhase === 'fantom') {
      if (victoryTimer > 1.0) {
        victoryHandEl.style.display = 'none';
        victoryPhase = 'done';
        handEl.style.display = '';
        transitionActive = true;
        transitionTimer = 1.5;
        pendingAct = 7;
      }
      return;
    }

    return;
  }
}

// ============ ACT 7 UPDATE ============
function updateAct7(dt) {
  if (act7Phase === 'idle') {
    if (player.y > 13.5) {
      act7Phase = 'bossLine';
      act7BossDialogIdx = -1;
      act7BossLineTimer = 0;
      act7Timer = 0;
      act7Boss.visible = true;
      act7BossBarVisible = true;
    }
    return;
  }

  if (act7Phase === 'bossLine') {
    act7BossLineTimer += dt;
    const perLine = 0.8;
    const idx = Math.min(ACT7_BOSS_LINES.length - 1, Math.floor(act7BossLineTimer / perLine));
    act7BossDialogIdx = idx;
    if (act7BossLineTimer >= perLine * ACT7_BOSS_LINES.length + 0.5) {
      act7Phase = 'psykosWalkIn';
      act7Timer = 0;
      psykos.mode = 'walkIn';
      psykos.x = ACT7_SPAWN_PSYKOS.x;
      psykos.y = ACT7_SPAWN_PSYKOS.y;
      psykosEl.style.display = 'block';
      psykosEl.src = 'psykos.webp';
      psykosEl.dataset.src = 'psykos.webp';
    }
    return;
  }

  if (act7Phase === 'psykosWalkIn') {
    const targetY = 12.5;
    const dx = 14.5 - psykos.x;
    const dy = targetY - psykos.y;
    const dist = Math.hypot(dx, dy);
    const speed = 4.0;
    if (dist > 0.2) {
      psykos.x += (dx / dist) * speed * dt;
      psykos.y += (dy / dist) * speed * dt;
      if (isWallForEnemy(psykos.x, psykos.y)) {
        psykos.y = Math.max(psykos.y, 11.0);
      }
    } else {
      act7Phase = 'dialog';
      act7Timer = 0;
      psykos.mode = 'dialog';
      act7BossDialogIdx = 0;
      act7BossLineTimer = 0;
      psykos.dialogLine = -1;
    }
    return;
  }

  if (act7Phase === 'dialog') {
    act7Timer += dt;
    const perLine = 1.0;
    const totalDur = perLine * ACT7_BOSS_LINES.length;
    const bossIdx = Math.min(ACT7_BOSS_LINES.length - 1, Math.floor(act7Timer / perLine));
    act7BossDialogIdx = bossIdx;
    if (act7Timer >= totalDur) {
      act7Phase = 'fight';
      playMusic('psykos');
      act7BossDialogIdx = -1;
      psykos.mode = 'fight';
      psykos.state = 'ready';
      psykos.stateTimer = PSYKOS_STATE_MIN + Math.random() * (PSYKOS_STATE_MAX - PSYKOS_STATE_MIN);
      psykos.cubeTimer = PSYKOS_CUBE_MIN + Math.random() * (PSYKOS_CUBE_MAX - PSYKOS_CUBE_MIN);
      psykos.dialogTimer = PSYKOS_DIALOG_INTERVAL_MIN + Math.random() * (PSYKOS_DIALOG_INTERVAL_MAX - PSYKOS_DIALOG_INTERVAL_MIN);
      psykos.dialogLine = -1;
      psykos.teleportPhase = 'none';
      psykos.teleportAnim = 0;
    }
    return;
  }

  if (act7Phase === 'dead') {
    return;
  }

  if (act7Phase === 'fight' && psykos.alive) {
    psykos.stateTimer -= dt;
    if (psykos.stateTimer <= 0) {
      psykos.state = psykos.state === 'ready' ? 'neady' : 'ready';
      psykos.stateTimer = PSYKOS_STATE_MIN + Math.random() * (PSYKOS_STATE_MAX - PSYKOS_STATE_MIN);
    }

    if (psykos.teleportPhase === 'none') {
      const distToPlayer = Math.hypot(player.x - psykos.x, player.y - psykos.y);
      if (psykos.state === 'ready' && distToPlayer > PSYKOS_TELEPORT_RANGE) {
        psykos.teleportPhase = 'prep';
        psykos.teleportAnim = PSYKOS_TELEPORT_PREP;
        psykosEl.src = 'psykosone.webp';
        psykosEl.dataset.src = 'psykosone.webp';
      } else if (psykos.state === 'neady' && distToPlayer < 2.0) {
        psykos.teleportPhase = 'prep';
        psykos.teleportAnim = PSYKOS_TELEPORT_PREP;
        psykosEl.src = 'psykosone.webp';
        psykosEl.dataset.src = 'psykosone.webp';
      }
    } else if (psykos.teleportPhase === 'prep') {
      psykos.teleportAnim -= dt;
      if (psykos.teleportAnim <= 0) {
        if (psykos.state === 'ready') {
          for (let tries = 0; tries < 30; tries++) {
            const ang = player.dir + (Math.random() - 0.5) * (FOV * 0.6);
            const rad = 2.5 + Math.random() * 2.0;
            const tx = player.x + Math.cos(ang) * rad;
            const ty = player.y + Math.sin(ang) * rad;
            if (!isWallForEnemy(tx, ty) && isInView(tx, ty, 0.1)) {
              psykos.teleportTarget = { x: tx, y: ty };
              break;
            }
          }
          if (!psykos.teleportTarget) {
            psykos.teleportTarget = { x: player.x + Math.cos(player.dir) * 3, y: player.y + Math.sin(player.dir) * 3 };
          }
        } else {
          for (let tries = 0; tries < 30; tries++) {
            const ang = Math.random() * Math.PI * 2;
            const rad = 6.0 + Math.random() * 5.0;
            const tx = player.x + Math.cos(ang) * rad;
            const ty = player.y + Math.sin(ang) * rad;
            if (!isWallForEnemy(tx, ty)) {
              psykos.teleportTarget = { x: tx, y: ty };
              break;
            }
          }
          if (!psykos.teleportTarget) {
            psykos.teleportTarget = { x: 14.5, y: 4.5 };
          }
        }
        psykos.teleportPhase = 'in';
        psykos.teleportAnim = PSYKOS_TELEPORT_IN;
        psykosEl.src = 'psykostwo.webp';
        psykosEl.dataset.src = 'psykostwo.webp';
      }
    } else if (psykos.teleportPhase === 'in') {
      psykos.teleportAnim -= dt;
      if (psykos.teleportAnim <= 0) {
        if (psykos.teleportTarget) {
          psykos.x = psykos.teleportTarget.x;
          psykos.y = psykos.teleportTarget.y;
        }
        psykos.teleportPhase = 'none';
        psykos.teleportTarget = null;
        psykosEl.src = 'psykos.webp';
        psykosEl.dataset.src = 'psykos.webp';
      }
    }

    if (psykos.teleportPhase === 'none') {
      const dx = player.x - psykos.x;
      const dy = player.y - psykos.y;
      const dist = Math.hypot(dx, dy);
      if (psykos.state === 'ready') {
        if (dist > 1.2) {
          const nx = psykos.x + (dx / dist) * PSYKOS_CHASE_SPEED * dt;
          const ny = psykos.y + (dy / dist) * PSYKOS_CHASE_SPEED * dt;
          if (!isWallForEnemy(nx, psykos.y)) psykos.x = nx;
          if (!isWallForEnemy(psykos.x, ny)) psykos.y = ny;
        }
        if (dist < PSYKOS_TOUCH_RANGE) {
          player.hp = Math.max(0, player.hp - PSYKOS_TOUCH_DAMAGE * dt);
          player.shake = Math.max(player.shake, 0.15);
        }
      } else {
        if (dist < 5.0) {
          const nx = psykos.x - (dx / dist) * PSYKOS_RETREAT_SPEED * dt;
          const ny = psykos.y - (dy / dist) * PSYKOS_RETREAT_SPEED * dt;
          if (!isWallForEnemy(nx, psykos.y)) psykos.x = nx;
          if (!isWallForEnemy(psykos.x, ny)) psykos.y = ny;
        }
      }
    }

    psykos.cubeTimer -= dt;
    if (psykos.cubeAnim > 0) {
      psykos.cubeAnim -= dt;
      if (psykos.cubeAnim <= 0) {
        psykosEl.src = 'psykos.webp';
        psykosEl.dataset.src = 'psykos.webp';
      }
    }
    if (psykos.cubeTimer <= 0 && psykos.cubeAnim <= 0 && psykos.teleportPhase === 'none') {
      psykos.cubeTimer = PSYKOS_CUBE_MIN + Math.random() * (PSYKOS_CUBE_MAX - PSYKOS_CUBE_MIN);
      psykos.cubeAnim = PSYKOS_ATAKING_DURATION;
      psykosEl.src = 'psykosataking.webp';
      psykosEl.dataset.src = 'psykosataking.webp';
      const dx = player.x - psykos.x;
      const dy = player.y - psykos.y;
      const d = Math.hypot(dx, dy) || 1;
      psykosCubes.push({
        x: psykos.x, y: psykos.y,
        vx: dx / d * PSYKOS_CUBE_SPEED,
        vy: dy / d * PSYKOS_CUBE_SPEED,
        life: 3.0
      });
    }

    for (let i = psykosCubes.length - 1; i >= 0; i--) {
      const c = psykosCubes[i];
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.life -= dt;
      if (c.life <= 0 || isWallForEnemy(c.x, c.y)) {
        psykosCubes.splice(i, 1);
        continue;
      }
      if (Math.hypot(c.x - player.x, c.y - player.y) < 0.8) {
        player.hp = Math.max(0, player.hp - PSYKOS_CUBE_DAMAGE);
        player.shake = Math.max(player.shake, 0.4);
        psykosCubes.splice(i, 1);
      }
    }

    if (psykos.dialogLine < 0) {
      psykos.dialogTimer -= dt;
      if (psykos.dialogTimer <= 0) {
        psykos.dialogLine = 0;
        psykos.dialogLineTimer = PSYKOS_DIALOG_DURATION;
        psykos.dialogTimer = PSYKOS_DIALOG_INTERVAL_MIN + Math.random() * (PSYKOS_DIALOG_INTERVAL_MAX - PSYKOS_DIALOG_INTERVAL_MIN);
      }
    } else {
      psykos.dialogLineTimer -= dt;
      if (psykos.dialogLineTimer <= 0) {
        psykos.dialogLine++;
        if (psykos.dialogLine >= ACT7_PSYKOS_LINES.length) {
          psykos.dialogLine = -1;
        } else {
          psykos.dialogLineTimer = PSYKOS_DIALOG_DURATION;
        }
      }
    }

 if (psykos.hp <= 0) {
  psykos.alive = false;
  psykosEl.style.display = 'none';
  act7Phase = 'dead';
  psykosCubes.length = 0;
  player.shake = Math.max(player.shake, 1.0);
  try { localStorage.setItem('act7done', '1'); } catch(e){}
}
  }
}

function updateAnt(dt, target) {
  ant.timer-=dt;
  if (ant.timer<=0){ ant.active=false; ant.cooldown=ANT_COOLDOWN_MAX; antEl.style.display='none'; return; }
  if (!target) {
    const adx=player.x-ant.x, ady=player.y-ant.y;
    const adist=Math.hypot(adx,ady);
    if (adist>0.5){ ant.x+=(adx/adist)*4.0*dt; ant.y+=(ady/adist)*4.0*dt; }
    return;
  }
  const adx=target.x-ant.x, ady=target.y-ant.y;
  const adist=Math.hypot(adx,ady);
  if (adist>4.0){
    ant.x+=(adx/adist)*4.0*dt; ant.y+=(ady/adist)*4.0*dt;
    if (isWallForEnemy(ant.x,ant.y)){ ant.x-=(adx/adist)*4.0*dt; ant.y-=(ady/adist)*4.0*dt; }
    ant.facing=Math.atan2(ady,adx);
  } else if (adist>0.1&&ant.attackAnim<=0) ant.facing=Math.atan2(ady,adx);
  if (ant.attackAnim>0) ant.attackAnim-=dt;
  else {
    ant.attackCd-=dt;
    if (ant.attackCd<=0&&adist<20){
      ant.attackAnim=1.0; ant.attackCd=4.0;
      if (act2&&boss.alive){ boss.hp=Math.max(0,boss.hp-15); if (boss.hp<=0) boss.alive=false; }
      else if (act3&&bossPhase==='f1'&&molten.alive){ molten.hp=Math.max(0,molten.hp-15); if (molten.hp<=0) moltenDie(); }
      else if (act3&&bossPhase==='f2'&&smoke.alive){ smoke.hp=Math.max(0,smoke.hp-15); if (smoke.hp<=0) smokeDie(); }
      else if (act4&&act4Phase==='f1'&&saimon.alive){ saimon.hp=Math.max(0,saimon.hp-20); }
      else if (act4&&act4Phase==='f2'&&vorot.alive){ vorot.hp=Math.max(0,vorot.hp-20); if (vorot.hp<=0) vorotDie(); }
      else if (act5&&(act5Phase==='phase1'||act5Phase==='phase2')&&garvi.alive&&!garvi.invuln&&garvi.portal){ garvi.hp=Math.max(0,garvi.hp-10); }
      else if (act6&&act6Phase==='fight'&&wake.alive){ wake.hp=Math.max(0,wake.hp-15); if (wake.hp<=0) wakeDie(); }
      else if (act7&&act7Phase==='fight'&&psykos.alive&&psykos.teleportPhase==='none'&&psykos.state==='neady'){ psykos.hp=Math.max(0,psykos.hp-15); }
      else if (act8&&act8Phase==='bossFight'&&act8Boss.alive){ act8Boss.hp=Math.max(0,act8Boss.hp-15); if (act8Boss.hp<=0) { act8Boss.alive=false; act8Phase='bossDead'; act8Timer=0; player.shake=Math.max(player.shake,1.0); try{localStorage.setItem('act8done','1');}catch(e){} } }
    }
  }
}

        if (hitBoss&&!line.hitEnemies.has(smoke)){ line.hitEnemies.add(smoke); smoke.hp-=SMOKE_HIT_DAMAGE; player.shake=Math.max(player.shake,0.4); if (smoke.hp<=0) smokeDie(); }
      }

function castRay(px, py, angle){
  const dx=Math.cos(angle), dy=Math.sin(angle);
  const safeDx = Math.abs(dx) < 1e-9 ? 1e-9 : dx;
  const safeDy = Math.abs(dy) < 1e-9 ? 1e-9 : dy;
  let mapX=Math.floor(px), mapY=Math.floor(py);
  const deltaDistX=Math.abs(1/safeDx);
  const deltaDistY=Math.abs(1/safeDy);
  let stepX, stepY, sideDistX, sideDistY;
  if (safeDx<0){ stepX=-1; sideDistX=(px-mapX)*deltaDistX; }
  else         { stepX= 1; sideDistX=(mapX+1-px)*deltaDistX; }
  if (safeDy<0){ stepY=-1; sideDistY=(py-mapY)*deltaDistY; }
  else         { stepY= 1; sideDistY=(mapY+1-py)*deltaDistY; }
  let side=0;
  for (let i=0;i<64;i++){
    if (sideDistX<sideDistY){
      sideDistX+=deltaDistX; mapX+=stepX; side=0;
    } else {
      sideDistY+=deltaDistY; mapY+=stepY; side=1;
    }
    if (mapX<0||mapY<0||mapX>=MAP_W||mapY>=MAP_H){
      return {dist:40, cell:1, side:0, x:px+safeDx*40, y:py+safeDy*40};
    }
    const c=map[mapY][mapX];
    if (c===1||c===3){
      let perp = side===0
        ? (mapX-px+(1-stepX)/2)/safeDx
        : (mapY-py+(1-stepY)/2)/safeDy;
      if (!isFinite(perp) || perp<0) perp=40;
      return {
        dist: Math.abs(perp),
        cell: c, side,
        x: px + safeDx*Math.abs(perp),
        y: py + safeDy*Math.abs(perp)
      };
    }
  }
  return {dist:40, cell:0, side:0, x:px+safeDx*40, y:py+safeDy*40};
}

function drawWallStrip(i, colW, horizon, projScale, hit, corr){
  const theme=currentTheme;
  const wallH=getWallHeight(hit.cell);
  const wallHpx=(wallH/Math.max(0.05,corr))*projScale;
  const floorY=horizon+(EYE_H/Math.max(0.05,corr))*projScale;
  const topY=floorY-wallHpx;
  if (hit.cell!==4) {
    const ceilingY=topY;
    const ceilingHeight=1.0;
    const ceilHpx=(ceilingHeight/Math.max(0.05,corr))*projScale;
    const cs=theme.ceilingShade;
    const ceilShade=Math.max(2,10-corr*2);
    const r=Math.min(255,(cs[0]*ceilShade/10)|0);
    const g=Math.min(255,(cs[1]*ceilShade/10)|0);
    const b=Math.min(255,(cs[2]*ceilShade/10)|0);
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.fillRect(i*colW, ceilingY-ceilHpx, colW+1, ceilHpx);
    if (corr<15){ ctx.fillStyle=theme.fogColor; ctx.fillRect(i*colW, ceilingY-2, colW+1, 2); }
  }
 if (hit.cell===3){
  const dc=theme.doorColor;
  const shade=Math.max(20,100-corr*6);
  ctx.fillStyle=`rgb(${Math.min(255,(dc[0]*shade/100)|0)},${Math.min(255,(dc[1]*shade/100)|0)},${Math.min(255,(dc[2]*shade/100)|0)})`;
  ctx.fillRect(i*colW, topY, colW+1, wallHpx);
} else {
  const wc=hit.side===1?theme.wallSide1:theme.wallSide0;
  const shade=Math.max(10,70-corr*6);
  ctx.fillStyle=`rgb(${Math.min(255,(wc[0]*shade/70)|0)},${Math.min(255,(wc[1]*shade/70)|0)},${Math.min(255,(wc[2]*shade/70)|0)})`;
  ctx.fillRect(i*colW, topY, colW+1, wallHpx);
}
}

function drawOuterWorld(horizon, projScale) {
  if (!isLoaded('highouterversal.webp')) return;
  const img=preloads['highouterversal.webp'];

  const worldH=36.0;
  const pCenter=project(outerWorldX, outerWorldY, worldH/2);
  const pTop=project(outerWorldX, outerWorldY, worldH);
  const pBottom=project(outerWorldX, outerWorldY, 0);
  if (pCenter&&pTop&&pBottom){

  }
}

const teleportCubeGradCache = new Map();
function getTeleportGrad(proj, radius, alpha) {
  const rKey=Math.round(radius/8)*8;
  const aKey=Math.round(alpha*4)/4;
  const key=rKey+'_'+aKey;
  let g=teleportCubeGradCache.get(key);
  if (!g){
    g=ctx.createRadialGradient(0,0,0,0,0,rKey);
    g.addColorStop(0,`rgba(180,180,220,${(0.75*aKey).toFixed(3)})`);
    g.addColorStop(0.5,`rgba(100,100,150,${(0.45*aKey).toFixed(3)})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    teleportCubeGradCache.set(key,g);
  }
  return g;
}

function drawTeleportCube(x, y, radiusWorld, alpha) {
  const proj=project(x,y,1.0);
  if (!proj) return;
  const dx=x-player.x, dy=y-player.y;
  const dist=Math.hypot(dx,dy);
  if (dist<0.01) return;
  const baseR=(radiusWorld*1.4/Math.max(0.4,dist))*(H*0.9);
  const grad=getTeleportGrad(proj, baseR, alpha);
  ctx.save();
  ctx.translate(proj.x, proj.y);
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.arc(0,0,baseR,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
  if (smokecubeImgEl.complete&&smokecubeImgEl.naturalWidth>0){
    const cubeH=(radiusWorld*2.0/Math.max(0.4,dist))*(H*0.9);
    const asp=(smokecubeImgEl.naturalWidth/smokecubeImgEl.naturalHeight)||1.0;
    const cubeW=cubeH*asp;
    ctx.save();
    ctx.globalAlpha=0.7*alpha;
    ctx.drawImage(smokecubeImgEl, proj.x-cubeW/2, proj.y-cubeH/2, cubeW, cubeH);
    ctx.restore();
  }
}

function drawVortexDom(el, x, y, sizeWorld, alpha, colW, numRays, zBuffer, horizon, projScale) {
  const dx=x-player.x, dy=y-player.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if (dist<0.3){ el.style.display='none'; return; }
  let a=Math.atan2(dy,dx)-player.dir;
  if (a>Math.PI) a-=Math.PI*2;
  else if (a<-Math.PI) a+=Math.PI*2;
  if (Math.abs(a)>FOV/2+0.5){ el.style.display='none'; return; }
  const screenX=W/2+Math.tan(a)*(W/2)/Math.tan(FOV/2);
  const colIdx=Math.floor(screenX/colW);
  if (colIdx>=0&&colIdx<numRays&&zBuffer[colIdx]<dist-0.15){ el.style.display='none'; return; }
  const screenY=horizon+(EYE_H-1.0)/dist*projScale;
  const hpx=(sizeWorld/dist)*projScale;
  const wpx=hpx;
  setSpriteBox(el, screenX, screenY, wpx, hpx, 250-Math.min(100,Math.round(dist*4)), alpha, false);
}

function drawMoltenSprite(horizon, projScale, colW, numRays, zBuffer) {
  if (bossPhase!=='f1'||!molten.alive||!bossRoomEntered){ moltenEl.style.display='none'; return; }
  const dx=molten.x-player.x, dy=molten.y-player.y;
  const dist=Math.hypot(dx,dy);
  let a=Math.atan2(dy,dx)-player.dir;
  while(a>Math.PI) a-=2*Math.PI;
  while(a<-Math.PI) a+=2*Math.PI;
  if (Math.abs(a)>FOV/2+0.6){ moltenEl.style.display='none'; return; }
  const screenX=W/2+Math.tan(a)*(W/2)/Math.tan(FOV/2);
  const colIdx=Math.floor(screenX/colW);
  if (colIdx>=0&&colIdx<numRays&&zBuffer[colIdx]<dist-0.15){ moltenEl.style.display='none'; return; }
  if (molten.fade>0.02){
    let src='molten.webp';
    if (molten.mode==='attack') src='moltenataking.webp';
    else if (molten.showBigCube>0) src='cube.png';
    if (moltenEl.dataset.src!==src){ moltenEl.src=src; moltenEl.dataset.src=src; }
    const hpx=((MOLTEN_TOP-MOLTEN_BOTTOM)/Math.max(0.4,dist))*projScale;
    const bottomY=horizon+((EYE_H-MOLTEN_BOTTOM)/Math.max(0.4,dist))*projScale;
    const topY=bottomY-hpx;
    const aspect=getAspect(src);
    const wpx=hpx*(aspect>0.1?aspect:MOLTEN_ASPECT);
    setSpriteBox(moltenEl, screenX, topY+hpx/2, wpx, hpx, 60, molten.fade, false);
  } else moltenEl.style.display='none';
  if (molten.portal>0.01){
    const proj=project(molten.x, molten.y, (MOLTEN_TOP+MOLTEN_BOTTOM)/2);
    if (proj){
      const baseR=(0.7/Math.max(0.4,dist))*projScale;
      const radius=baseR*molten.portal;
      ctx.save();
      const grad=ctx.createRadialGradient(proj.x,proj.y,0,proj.x,proj.y,radius);
      grad.addColorStop(0,'rgba(200,80,255,0.9)');
      grad.addColorStop(0.6,'rgba(120,30,180,0.7)');
      grad.addColorStop(1,'rgba(40,0,60,0)');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.arc(proj.x,proj.y,radius,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawSmokeSprite(horizon, projScale, colW, numRays, zBuffer) {
  if (bossPhase!=='f2'||!smoke.alive){ smokeEl.style.display='none'; return; }
  const dx=smoke.x-player.x, dy=smoke.y-player.y;
  const dist=Math.hypot(dx,dy);
  let a=Math.atan2(dy,dx)-player.dir;
  while(a>Math.PI) a-=2*Math.PI;
  while(a<-Math.PI) a+=2*Math.PI;
  if (smokeNearPortal.active){
    const pdx=smokeNearPortal.x-player.x, pdy=smokeNearPortal.y-player.y;
    let pa=Math.atan2(pdy,pdx)-player.dir;
    while(pa>Math.PI) pa-=2*Math.PI;
    while(pa<-Math.PI) pa+=2*Math.PI;
    if (Math.abs(pa)<FOV/2+0.4){
      const pcolIdx=Math.floor((W/2+Math.tan(pa)*(W/2)/Math.tan(FOV/2))/colW);
      const pd=Math.hypot(pdx,pdy);
      if (!(pcolIdx>=0&&pcolIdx<numRays&&zBuffer[pcolIdx]<pd-0.15)){
        const lifeRatio=Math.max(0, smokeNearPortal.life/smokeNearPortal.maxLife);
        drawTeleportCube(smokeNearPortal.x, smokeNearPortal.y, 0.9+0.3*(1-lifeRatio), lifeRatio);
      }
    }
  }
  for (const fp of smokeFarPortals){
    const pdx=fp.x-player.x, pdy=fp.y-player.y;
    let pa=Math.atan2(pdy,pdx)-player.dir;
    while(pa>Math.PI) pa-=2*Math.PI;
    while(pa<-Math.PI) pa+=2*Math.PI;
    if (Math.abs(pa)>FOV/2+0.4) continue;
    const psx=W/2+Math.tan(pa)*(W/2)/Math.tan(FOV/2);
    const pcol=Math.floor(psx/colW);
    const pd=Math.hypot(pdx,pdy);
    if (pcol>=0&&pcol<numRays&&zBuffer[pcol]<pd-0.15) continue;
    const lifeRatio=Math.max(0, fp.life/fp.maxLife);
    const fadeIn=Math.min(1, (fp.maxLife-fp.life)/0.3);
    const alpha=Math.min(fadeIn, lifeRatio);
    drawTeleportCube(fp.x, fp.y, 1.4, alpha);
  }
  if (Math.abs(a)<FOV/2+0.6){
    const screenX=W/2+Math.tan(a)*(W/2)/Math.tan(FOV/2);
    const colIdx=Math.floor(screenX/colW);
    if (!(colIdx>=0&&colIdx<numRays&&zBuffer[colIdx]<dist-0.15)){
      const src=smokeEl.dataset.src||'smokemolten.webp';
      const hpx=((MOLTEN_TOP-MOLTEN_BOTTOM)/Math.max(0.4,dist))*projScale;
      const bottomY=horizon+((EYE_H-MOLTEN_BOTTOM)/Math.max(0.4,dist))*projScale;
      const topY=bottomY-hpx;
      const aspect=getAspect(src);
      const wpx=hpx*(aspect>0.1?aspect:MOLTEN_ASPECT);
      setSpriteBox(smokeEl, screenX, topY+hpx/2, wpx, hpx, 60, smoke.fade, false);
    } else smokeEl.style.display='none';
  } else smokeEl.style.display='none';
  for (const c of smokeCubes){
    const cdx=c.x-player.x, cdy=c.y-player.y;
    const cd=Math.hypot(cdx,cdy);
    let ca=Math.atan2(cdy,cdx)-player.dir;
    while(ca>Math.PI) ca-=2*Math.PI;
    while(ca<-Math.PI) ca+=2*Math.PI;
    if (Math.abs(ca)>FOV/2+0.5) continue;
    const csx=W/2+Math.tan(ca)*(W/2)/Math.tan(FOV/2);
    const ccol=Math.floor(csx/colW);
    if (ccol>=0&&ccol<numRays&&zBuffer[ccol]<cd-0.15) continue;
    const proj=project(c.x,c.y,1.0);
    if (!proj) continue;
    const chpx=(c.size/Math.max(0.4,cd))*projScale;
    if (smokecubeImgEl.complete&&smokecubeImgEl.naturalWidth>0){
      const asp=(smokecubeImgEl.naturalWidth/smokecubeImgEl.naturalHeight)||1.0;
      const cwpx=chpx*asp;
      ctx.save();
      ctx.globalAlpha=0.7;
      ctx.drawImage(smokecubeImgEl, proj.x-cwpx/2, proj.y-chpx/2, cwpx, chpx);
      ctx.restore();
    }
  }
}

      let handY=saimon.y+perpY*handOffsetSide;
      let handZ=SAIMON_TOP*0.6;

      } else {
        const distP=Math.hypot(player.x-saimon.x, player.y-saimon.y);
        if (distP<SAIMON_HAND_REACH){
          const reach=1.0-distP/SAIMON_HAND_REACH;

          handY=saimon.y+(player.y-saimon.y)*0.4*reach;

      const hdx=handX-player.x, hdy=handY-player.y;

  if (voda.active&&isLoaded('badvodovorot.webp')) {
    const dx=voda.x-player.x, dy=voda.y-player.y;

    else {

      const colIdx=Math.floor(screenX/colW);
      if (colIdx>=0&&colIdx<numRays&&zBuffer[colIdx]<dist-0.15){ vodaEl.style.display='none'; }
      else {
        const aspect=getAspect('badvodovorot.webp');
        const hpx=((1.5-0.1)/Math.max(0.4,dist))*projScale;
        const bottomY=horizon+((EYE_H-0.1)/Math.max(0.4,dist))*projScale;
        const topY=bottomY-hpx;
        const wpx=hpx*(aspect>0.1?aspect:1.0);
        setSpriteBox(vodaEl, screenX, topY+hpx/2, wpx, hpx, 59, 1, false);
      }
    }
  } else vodaEl.style.display='none';
  if (act4Phase==='f2'&&vorot.alive&&isLoaded('vorotsaimon.webp')) {
    const dx=vorot.x-player.x, dy=vorot.y-player.y;
    const dist=Math.hypot(dx,dy);
    let a=Math.atan2(dy,dx)-player.dir;
    while(a>Math.PI) a-=2*Math.PI;
    while(a<-Math.PI) a+=2*Math.PI;
    if (Math.abs(a)>FOV/2+0.6){ vorotEl.style.display='none'; }
    else {
      const screenX=W/2+Math.tan(a)*(W/2)/Math.tan(FOV/2);
      const colIdx=Math.floor(screenX/colW);
      if (colIdx>=0&&colIdx<numRays&&zBuffer[colIdx]<dist-0.15){ vorotEl.style.display='none'; }
      else {
        const aspect=getAspect('vorotsaimon.webp');
        const hpx=((SAIMON_TOP-SAIMON_BOTTOM)/Math.max(0.4,dist))*projScale;
        const bottomY=horizon+((EYE_H-SAIMON_BOTTOM)/Math.max(0.4,dist))*projScale;
        const topY=bottomY-hpx;
        const wpx=hpx*(aspect>0.1?aspect:SAIMON_ASPECT);
        setSpriteBox(vorotEl, screenX, topY+hpx/2, wpx, hpx, 60, 0.7, false);
      }
    }
  } else vorotEl.style.display='none';
  for (let i=0;i<vodovorotPool.length;i++){
    const el=vodovorotPool[i];
    const v=vodovorots[i];
    if (!v){ el.style.display='none'; continue; }
    drawVortexDom(el, v.x, v.y, 1.6, Math.min(1, v.life/0.3), colW, numRays, zBuffer, horizon, projScale);
  }
  for (let i=0;i<badvodovorotPool.length;i++){

function drawAct5Lamps(horizon, projScale, colW, numRays, zBuffer) {
  if (!currentTheme.act5Lamps) return;
  for (const cp of act5LampPositions) {
    const dx = cp.x - player.x, dy = cp.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.5) continue;
    let a = Math.atan2(dy, dx) - player.dir;
    while (a >  Math.PI) a -= 2*Math.PI;
    while (a < -Math.PI) a += 2*Math.PI;
    if (Math.abs(a) > FOV/2 + 0.3) continue;

    const screenX = W/2 + Math.tan(a)*(W/2)/Math.tan(FOV/2);

    const floorY = horizon + (EYE_H / Math.max(0.4, dist)) * projScale;
    const colTopZ = 6.0;
    const topY = horizon + ((EYE_H - colTopZ) / Math.max(0.4, dist)) * projScale;
    const colHpx = floorY - topY;

    const colWpx = colHpx * 0.10;
    const gradCol = ctx.createLinearGradient(screenX, topY, screenX, topY + colHpx);
    gradCol.addColorStop(0, `rgba(95,85,75,${Math.max(0.45, 1 - dist*0.05)})`);
    gradCol.addColorStop(1, `rgba(45,40,35,${Math.max(0.35, 1 - dist*0.05)})`);
    ctx.fillStyle = gradCol;
    ctx.fillRect(screenX - colWpx/2, topY, colWpx, colHpx);
    const lampX  = screenX + colWpx * 0.8;
    const lampCy = topY + colHpx * 0.05;
    const lampR  = Math.max(16, colWpx * 6.0);

    const grad = ctx.createRadialGradient(lampX, lampCy, 0, lampX, lampCy, lampR);
    grad.addColorStop(0.0,  `rgba(255,250,220,${Math.max(0.85, 1 - dist*0.05)})`);
    grad.addColorStop(0.15, `rgba(255,210,120,${Math.max(0.7, 0.9 - dist*0.05)})`);

    grad.addColorStop(1.0,  'rgba(0,0,0,0)');

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(lampX, lampCy, lampR * 1.6, lampR, 0, 0, Math.PI * 2);

function drawAct6World(horizon, projScale, colW, numRays, zBuffer) {

    const dist = Math.hypot(dx, dy);
    if (dist > 0.5) {
      let a = Math.atan2(dy, dx) - player.dir;
      while (a > Math.PI) a -= 2 * Math.PI;
      while (a < -Math.PI) a += 2 * Math.PI;
      if (Math.abs(a) < FOV / 2 + 0.4) {
        const screenX = W / 2 + Math.tan(a) * (W / 2) / Math.tan(FOV / 2);
        const colIdx = Math.floor(screenX / colW);
        if (colIdx >= 0 && colIdx < numRays && zBuffer[colIdx] > dist - 0.3) {
          const proj = project(portal.x, portal.y, 1.0);
          if (proj) {
            const baseR = (1.0 / Math.max(0.4, dist)) * projScale;
            const grad = ctx.createRadialGradient(proj.x, proj.y, 0, proj.x, proj.y, baseR);
            grad.addColorStop(0, 'rgba(255,255,255,0.95)');
            grad.addColorStop(0.3, 'rgba(255,255,255,0.7)');
            grad.addColorStop(0.6, 'rgba(220,220,255,0.4)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(proj.x, proj.y, baseR, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
      }
    }
  }

sunGradCache.addColorStop(0.00, 'rgba(255,255,255,1.00)');

function updateGarvi(dt) {
  if (act5Phase === 'talk1') {
    act5TalkTimer += dt;
    const totalDur = 10.0;
    const perLine = totalDur / GARVI_DIALOGS.length;
    const idx = Math.min(GARVI_DIALOGS.length - 1, Math.floor(act5TalkTimer / perLine));
    act5TalkIdx = idx;
    if (act5TalkTimer >= totalDur) {
      act5TalkTimer = 0;
      act5StartPhase1();
    }
    return;
  }

  if (act5Phase === 'talk2') {
    act5TalkTimer += dt;
    const totalDur = 8.0;
    const perLine = totalDur / GARVI_PHASE2_DIALOGS.length;
    const idx = Math.min(GARVI_PHASE2_DIALOGS.length - 1, Math.floor(act5TalkTimer / perLine));
    act5TalkIdx = idx;
    if (act5TalkTimer >= totalDur) {
      startPhase2Garvi();
    }
    return;
  }

  if (act5Phase === 'death_talk') {
  act5TalkTimer += dt;
  const totalDur = 8.0;
  const perLine = totalDur / GARVI_DEATH_DIALOGS.length;
  const idx = Math.min(GARVI_DEATH_DIALOGS.length - 1, Math.floor(act5TalkTimer / perLine));
  act5TalkIdx = idx;
  if (act5TalkTimer >= totalDur) {
    act5Phase = 'dead';
    if (!lightUnlocked) {
      lightUnlocked = true;
      try { localStorage.setItem(LIGHT_KEY, 'alive'); } catch(e){}
      showLightButton();
    }
    try { localStorage.setItem('act5done', '1'); } catch(e){}
  }
  return;
}

  if (act5Phase !== 'phase1' && act5Phase !== 'phase2') return;
  if (!garvi.alive) return;

  if (garvi.cloneCooldown > 0) garvi.cloneCooldown -= dt;

  if (garvi.dodgeTimer > 0) {
    garvi.dodgeTimer -= dt;
    const nx = garvi.x + garvi.dodgeVX * GARVI_DODGE_SPEED * dt;
    const ny = garvi.y + garvi.dodgeVY * GARVI_DODGE_SPEED * dt;
    if (!isWallForEnemy(nx, garvi.y)) garvi.x = nx;
    if (!isWallForEnemy(garvi.x, ny)) garvi.y = ny;
  } else {
    const dxP = player.x - garvi.x;
    const dyP = player.y - garvi.y;
    const distP = Math.hypot(dxP, dyP) || 1;
    if (garvi.invuln) {
      const nx = garvi.x + (dxP / distP) * GARVI_CHASE_SPEED * dt;
      const ny = garvi.y + (dyP / distP) * GARVI_CHASE_SPEED * dt;
      if (!isWallForEnemy(nx, garvi.y)) garvi.x = nx;
      if (!isWallForEnemy(garvi.x, ny)) garvi.y = ny;
      if (distP < GARVI_TOUCH_RANGE) {
        player.hp = Math.max(0, player.hp - GARVI_TOUCH_DAMAGE * dt * 2);
        player.shake = Math.max(player.shake, 0.2);
      }
    } else {
      const nx = garvi.x - (dxP / distP) * GARVI_FLEE_SPEED * dt;
      const ny = garvi.y - (dyP / distP) * GARVI_FLEE_SPEED * dt;
      if (!isWallForEnemy(nx, garvi.y)) garvi.x = nx;
      if (!isWallForEnemy(garvi.x, ny)) garvi.y = ny;
    }
  }

  if (!garvi.portal && !garvi.invuln) {
    garvi.portalTimer -= dt;
    if (garvi.portalTimer <= 0) {
      garviSpawnPortal();
      if (act5Phase === 'phase2') {
        garvi.portalTimer = GARVI_PORTAL_MIN_F2 + Math.random() * (GARVI_PORTAL_MAX_F2 - GARVI_PORTAL_MIN_F2);
      } else {
        garvi.portalTimer = GARVI_PORTAL_MIN + Math.random() * (GARVI_PORTAL_MAX - GARVI_PORTAL_MIN);
      }
    }
  }

  if (garvi.heart) garviHeartUpdate(dt);

  for (let i = garviClones.length - 1; i >= 0; i--) {
    const c = garviClones[i];
    const dx = player.x - c.x;
    const dy = player.y - c.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = c.x + (dx / d) * c.speed * dt;
    const ny = c.y + (dy / d) * c.speed * dt;
    if (!isWallForEnemy(nx, c.y)) c.x = nx;
    if (!isWallForEnemy(c.x, ny)) c.y = ny;
    if (d < 1.0) {
      player.hp = Math.max(0, player.hp - GARVI_CLONE_TOUCH_DAMAGE * dt);
      player.shake = Math.max(player.shake, 0.15);
    }
  }
}

function garviSpawnPortal() {
  const centerX = ACT5_SPAWN_BOSS.x;
  const centerY = ACT5_SPAWN_BOSS.y;

  let attempts = 0;
  while (attempts < 30) {
    attempts++;
    const angle = Math.random() * Math.PI * 2;
    const radius = 2 + Math.random() * 1.0;
    const rx = centerX + Math.cos(angle) * radius;
    const ry = centerY + Math.sin(angle) * radius;

    if (isWallForEnemy(rx, ry)) continue;
    if (Math.hypot(rx - player.x, ry - player.y) < 1.5) continue;

    garvi.portal = { x: rx, y: ry, hp: GARVI_PORTAL_HITS, maxHp: GARVI_PORTAL_HITS };
    garvi.invuln = true;
    garvi.fade = 0.5;
    garviPortalEl.style.display = 'block';
    garviPortalEl.src = 'portal.webp';
    return;
  }

  if (!isWallForEnemy(centerX, centerY)) {
    garvi.portal = { x: centerX, y: centerY, hp: GARVI_PORTAL_HITS, maxHp: GARVI_PORTAL_HITS };
    garvi.invuln = true;
    garvi.fade = 0.5;
    garviPortalEl.style.display = 'block';
    garviPortalEl.src = 'portal.webp';
    return;
  }

  garvi.portalTimer = 0.3;
}

function garviSpawnHeart() {
  const centerX = ACT5_SPAWN_BOSS.x;
  const centerY = ACT5_SPAWN_BOSS.y;

  let attempts = 0;
  while (attempts < 40) {
    attempts++;
    const angle = Math.random() * Math.PI * 2;
    const radius = 2 + Math.random() * 1.0;
    const rx = centerX + Math.cos(angle) * radius;
    const ry = centerY + Math.sin(angle) * radius;

    if (isWallForEnemy(rx, ry)) continue;
    if (Math.hypot(rx - player.x, ry - player.y) < 2.0) continue;

    garvi.heart = { x: rx, y: ry, hp: GARVI_HEART_HP, maxHp: GARVI_HEART_HP, dirX: 0, dirY: 0, changeDirTimer: 0.3 };
    garviHeartEl.style.display = 'block';
    garviHeartEl.src = 'portal.webp';
    return;
  }

  if (!isWallForEnemy(centerX, centerY)) {
    garvi.heart = { x: centerX, y: centerY, hp: GARVI_HEART_HP, maxHp: GARVI_HEART_HP, dirX: 0, dirY: 0, changeDirTimer: 0.3 };
    garviHeartEl.style.display = 'block';
    garviHeartEl.src = 'portal.webp';
  }
}

function garviHeartUpdate(dt) {
  if (!garvi.heart) return;
  const h = garvi.heart;
  const dx = h.x - player.x;
  const dy = h.y - player.y;
  const d = Math.hypot(dx, dy) || 1;
  const fleeSpeed = GARVI_HEART_FLEE_SPEED;
  let mvx = (dx / d) * fleeSpeed;
  let mvy = (dy / d) * fleeSpeed;
  h.changeDirTimer -= dt;
  if (h.changeDirTimer <= 0) {
    h.dirX = (Math.random() - 0.5) * 0.6;
    h.dirY = (Math.random() - 0.5) * 0.6;
    h.changeDirTimer = 0.3 + Math.random() * 0.4;
  }
  mvx += h.dirX;
  mvy += h.dirY;

  let nx = h.x + mvx * dt;
  let ny = h.y + mvy * dt;

  if (isWallForEnemy(nx, ny)) {
    const cx = ACT5_SPAWN_BOSS.x;
    const cy = ACT5_SPAWN_BOSS.y;
    const cdx = cx - h.x, cdy = cy - h.y;
    const cd = Math.hypot(cdx, cdy) || 1;
    nx = h.x + (cdx / cd) * GARVI_HEART_CENTER_SPEED * dt;
    ny = h.y + (cdy / cd) * GARVI_HEART_CENTER_SPEED * dt;
    if (isWallForEnemy(nx, h.y)) nx = h.x;
    if (isWallForEnemy(h.x, ny)) ny = h.y;
  }
  h.x = nx;
  h.y = ny;

  if (h.x < 1.2) h.x = 1.2;
  if (h.x > MAP_W - 1.2) h.x = MAP_W - 1.2;
  if (h.y < 1.2) h.y = 1.2;
  if (h.y > MAP_H - 1.2) h.y = MAP_H - 1.2;
}

function garviClearPortal() {
  garvi.portal = null;
  garvi.invuln = false;
  garvi.fade = 1.0;
  garviPortalEl.style.display = 'none';
  if (act5Phase === 'phase1') {
    if (!garvi.heart) garviSpawnHeart();
  } else if (act5Phase === 'phase2') {
    if (!garvi.heart) garviSpawnHeart();
  }
}

function garviBreakHeart() {
  const h = garvi.heart;
  if (!h) return;
  garvi.heart = null;
  garviHeartEl.style.display = 'none';
  garvi.hp = Math.max(0, garvi.hp - GARVI_HEART_DMG_ON_BREAK);
  player.shake = Math.max(player.shake, 0.4);
  if (garvi.hp <= 0 && !garvi.invuln) {
    garviDie();
    return;
  }
}

function garviTryDodge() {
  if (!garvi.alive || garvi.invuln) return;
  if (act5Phase !== 'phase2') return;
  garvi.dodgeTimer = GARVI_DODGE_DUR;
  const dx = garvi.x - player.x;
  const dy = garvi.y - player.y;
  const d = Math.hypot(dx, dy) || 1;
  const bx = dx / d, by = dy / d;
  const px = -by, py = bx;
  const side = Math.random() < 0.5 ? -1 : 1;
  garvi.dodgeVX = (bx + px * side * 0.6);
  garvi.dodgeVY = (by + py * side * 0.6);
  const dl = Math.hypot(garvi.dodgeVX, garvi.dodgeVY) || 1;
  garvi.dodgeVX /= dl;
  garvi.dodgeVY /= dl;
  garviSpawnClone();
}

function garviSpawnClone() {
  if (garviClones.length >= GARVI_MAX_CLONES) return;
  const dx = player.x - garvi.x;
  const dy = player.y - garvi.y;
  const d = Math.hypot(dx, dy) || 1;
  let cx = garvi.x + (dx / d) * 1.2;
  let cy = garvi.y + (dy / d) * 1.2;
  if (isWallForEnemy(cx, cy)) { cx = garvi.x; cy = garvi.y; }
  const el = document.createElement('img');
  el.className = 'enemy-img';
  el.src = 'clonegarvi.webp';
  el.style.display = 'none';
  document.body.appendChild(el);
  garviClones.push({
    x: cx, y: cy, el,
    speed: 1.2 + Math.random() * 1.2
  });
}

function garviDie() {
  garvi.alive = false;
  garviEl.style.display = 'none';
  garviPortalEl.style.display = 'none';
  garviHeartEl.style.display = 'none';
  garvi.portal = null;
  garvi.heart = null;
  for (const c of garviClones) c.el.remove();
  garviClones.length = 0;
  act5Phase = 'death_talk';
  act5TalkTimer = 0;
  act5TalkIdx = 0;
  player.shake = Math.max(player.shake, 1.0);
}

function handleGarviLineHits(line) {
  if (!garvi.alive) return;
  if (act5Phase !== 'phase1' && act5Phase !== 'phase2') return;

  if (garvi.portal && line.timer > 0.05 && line.timer < 0.25) {
    let hitPortal = false;
    if (line.type === 1 || line.type === 2) {
      if (distToSegment(garvi.portal.x, garvi.portal.y, line.L.x, line.L.y, line.R.x, line.R.y) < 0.6) hitPortal = true;
    } else {
      const pt = line.type === 3 ? line.L : line.R;
      if (Math.hypot(garvi.portal.x - pt.x, garvi.portal.y - pt.y) < 0.6) hitPortal = true;
    }
    if (hitPortal && !line.hitEnemies.has(garvi.portal)) {
      line.hitEnemies.add(garvi.portal);
      garvi.portal.hp--;
      player.shake = Math.max(player.shake, 0.25);
      if (garvi.portal.hp <= 0) {
        garviClearPortal();
      }
    }
  }

  if (garvi.heart && line.timer > 0.05 && line.timer < 0.25) {
    let hitHeart = false;
    if (line.type === 1 || line.type === 2) {
      if (distToSegment(garvi.heart.x, garvi.heart.y, line.L.x, line.L.y, line.R.x, line.R.y) < 0.6) hitHeart = true;
    } else {
      const pt = line.type === 3 ? line.L : line.R;
      if (Math.hypot(garvi.heart.x - pt.x, garvi.heart.y - pt.y) < 0.6) hitHeart = true;
    }
    if (hitHeart && !line.hitEnemies.has(garvi.heart)) {
      line.hitEnemies.add(garvi.heart);
      garvi.heart.hp--;
      player.shake = Math.max(player.shake, 0.2);
      if (garvi.heart.hp <= 0) {
        garviBreakHeart();
      }
    }
  }

  if (!garvi.invuln && !garvi.portal) {
    let hitBoss = false;
    if (line.type === 1 || line.type === 2) {
      if (distToSegment(garvi.x, garvi.y, line.L.x, line.L.y, line.R.x, line.R.y) < 1.0) hitBoss = true;
    } else {
      const pt = line.type === 3 ? line.L : line.R;
      if (Math.hypot(garvi.x - pt.x, garvi.y - pt.y) < 1.0) hitBoss = true;
    }
    if (hitBoss && !line.hitEnemies.has(garvi)) {
      line.hitEnemies.add(garvi);
      garvi.hp -= GARVI_HIT_DAMAGE;
      player.shake = Math.max(player.shake, 0.4);
      if (garvi.hp <= 0) {
        if (act5Phase === 'phase1') {
          act5Phase = 'talk2';
          act5TalkTimer = 0;
          act5TalkIdx = 0;
          garviEl.style.display = 'none';
          garviPortalEl.style.display = 'none';
          garviHeartEl.style.display = 'none';
          garvi.portal = null;
          garvi.heart = null;
        } else if (act5Phase === 'phase2') {
          garviDie();
        }
      }
    }
  }
}
